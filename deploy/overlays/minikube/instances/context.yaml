apiVersion: clerum.io/v1alpha1
kind: Context
metadata:
  name: context1
  namespace: mcp-server
spec:
  contextId: context1
  description: Default minikube context — defines which MCP servers the host can access.
  # Intentionally empty on a clean install. mcp-host's native tools (shell,
  # fileRead/fileWrite, httpRequest, memory) work without any MCP server, so
  # chatllm is fully usable out of the box. Install servers from the registry,
  # or use `make minikube-setup-e2e` for the demo set.
  mcpServers: []
