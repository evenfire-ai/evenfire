# Minikube resource limits — reduced for local development
# Base limits are already moderate; we reduce rpc-proxy replicas to 1 and
# lower its cpu/memory for a single-node minikube environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-proxy
  namespace: rpc-proxy
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: rpc-proxy
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# control-api: base is 300m/256Mi — keep but explicitly confirm for minikube
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: control-plane
spec:
  template:
    spec:
      containers:
        - name: control-api
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
---
