# Initial Context selection under SEED_PROFILE=e2e. Existing Contexts keep their
# user-managed selection, including any demo connectors the user has removed.
apiVersion: clerum.io/v1alpha1
kind: Context
metadata:
  name: context1
  namespace: mcp-server
spec:
  contextId: context1
  description: Default minikube context — defines which MCP servers the host can access.
  mcpServers:
    - airtable-server
    - mongodb-server
    - mongodb-mcp-stack-mongodb-mcp-server
