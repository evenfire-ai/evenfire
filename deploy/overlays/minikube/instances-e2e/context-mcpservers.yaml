# Applied only under SEED_PROFILE=e2e, after instances/context.yaml, to re-add
# the demo MCP servers the E2E suites expect.
apiVersion: clerum.io/v1alpha1
kind: Context
metadata:
  name: context1
  namespace: mcp-server
spec:
  contextId: context1
  description: Default minikube context — defines which MCP servers the host can access.
  mcpServers:
    - airtable-server
    - mongodb-server
    - mongodb-mcp-stack-mongodb-mcp-server
