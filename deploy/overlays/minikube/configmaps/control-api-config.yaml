apiVersion: v1
kind: ConfigMap
metadata:
  name: control-api-config
  namespace: control-plane
  labels:
    app: control-api
data:
  CONTROL_API_PORT: '8090'
  TRACING_ENVIRONMENT: 'local'
  TRACING_CLUSTER_NAME: 'minikube'
  TRACING_CLUSTER_LOCATION: 'local'
  # minikube-only: point the Figure D delivery worker at the fake-telegram-server
  # (tests/e2e/fixtures/fake-telegram-server). Prod default stays https://api.telegram.org.
  WORKFLOW_APPROVAL_TELEGRAM_API_ROOT: 'http://fake-telegram-server.channels.svc.cluster.local:8080'
  CONTROL_API_NAMESPACE: 'mcp-server'
  CONTROL_API_HOSTS_NAMESPACE: 'mcp-host'
  CONTROL_API_CONTEXTS_NAMESPACE: 'mcp-server'
  CONTROL_API_COMMUNICATION_CHANNELS_NAMESPACE: 'channels'
  CONTROL_API_MCP_SERVERS_NAMESPACE: 'mcp-server'
  CONTROL_API_SECRETS_NAMESPACE: 'mcp-host'
  CONTROL_API_PG_CONNECTION_STRING: 'postgres://postgres:postgres@control-postgres.control-plane.svc.cluster.local:5432/profiles'
  # CONTROL_API_INTERNAL_TOKENS / CONTROL_API_INTERNAL_SERVICE_TOKENS removed —
  # projected from the `control-api-internal-tokens` Secret (populated by
  # `apply-inter-service-tokens.sh`). See secrets-canary.yaml in base.
  # member-registration-service runs as an extracted sibling in the `registration`
  # namespace (deployed locally via scripts/minikube/deploy-evenfire-member-registration.sh).
  # control-api authenticates with a per-tenant HMAC JWT — the dev-default
  # kid/tenant/secret seeded into the sibling postgres tenant_credentials table.
  CONTROL_API_MEMBER_REGISTRATION_SERVICE_BASE_URL: 'http://member-registration-service.registration.svc.cluster.local:8092/api/v1'
  CONTROL_API_DESKTOP_EXTERNAL_REST_API_BASE_URL: 'http://127.0.0.1:8091'
  CONTROL_API_DESKTOP_RPC_PROXY_BASE_URL: 'http://127.0.0.1:8094'
  CONTROL_API_DESKTOP_PROFILE_UI_BASE_URL: 'http://127.0.0.1:3001'
  CONTROL_API_DESKTOP_APP_NAME: 'Evenfire'
  # minikube-only: base URL control-api uses to build the OAuth `redirect_uri`
  # for the mcp-server per-user flow (control-api/src/routes/external/oauthCallback.ts).
  # Without it, control-api falls back to the request Host — which, behind the
  # rpc-proxy → gateway chain, is the internal svc hostname
  # (control-api-rpc-gateway.control-plane.svc.cluster.local:8090), NOT reachable
  # by the user's browser and NOT matching the provider's registered redirect URI.
  # Locally the user consents in their own browser, so the callback must land on
  # the port-forwarded loopback. Register this EXACT literal as the redirect URI
  # in each provider's OAuth app: http://127.0.0.1:8090/api/v1/oauth-callback/<oauth.id>.
  # (Distinct from RPC_PROXY_OAUTH_CALLBACK_BASE_URL, which is the legacy
  # recipe/embed flow and uses `localhost` — do not conflate them.)
  CONTROL_API_OAUTH_CALLBACK_BASE_URL: 'http://127.0.0.1:8090'
  # Enable the mcp-server per-user OAuth broker (control-api/src/routes/mcpOauth.ts).
  # `MCP_OAUTH_BROKER_ENABLED` is fail-closed OFF by default: without it every
  # POST /api/v1/mcp-oauth/user-token returns 404 not_found (requireBrokerEnabled),
  # which mcp-host reads as `no_grant` — so a per-user oauth mcp-server suspends
  # for consent forever and NEVER resolves a token even after the grant exists.
  # Required for the U1–U6 reactive-consent flow to work end to end.
  MCP_OAUTH_BROKER_ENABLED: 'true'
  # Self-hosted-only GFS operator parity. Managed/base deployments remain
  # fail-closed because this narrow elevation flag is absent there.
  CONTROL_API_DESKTOP_GFS_OPERATOR_LINKING_ENABLED: 'true'
  CONTROL_API_CONTROL_UI_BASE_URL: 'http://127.0.0.1:3000'
  CONTROL_API_CONTROL_UI_APP_NAME: 'Evenfire'
  CONTROL_API_POLICY_AUTH_AUDIENCE: 'control-api'
  CONTROL_API_JWT_ISSUER: 'control-api'
  CONTROL_API_JWT_AUDIENCE: 'dev-profile-ui'
  CONTROL_API_ADMIN_JWT_ISSUER: 'control-api'
  CONTROL_API_ADMIN_JWT_AUDIENCE: 'control-ui'
  CONTROL_API_ADMIN_JWT_TTL_SECONDS: '3600'
  CONTROL_API_ADMIN_AUTH_MAX_FAILURES: '5'
  CONTROL_API_ADMIN_AUTH_LOCK_MINUTES: '15'
  CONTROL_API_ADMIN_BOOTSTRAP_USERNAME: 'admin'
  CONTROL_API_ADMIN_BOOTSTRAP_EMAIL: ''
  CONTROL_API_GOOGLE_CLIENT_ID: 'minikube-test.apps.googleusercontent.com'
  CONTROL_API_RPC_JWT_ISSUER: 'control-api'
  CONTROL_API_RPC_JWT_AUDIENCE: 'rpc-proxy'
  CONTROL_API_RPC_TOKEN_TTL_SECONDS: '300'
  WORKFLOW_APPROVAL_ACCESS_TTL_SEC: '600'
  WORKFLOW_APPROVAL_REFRESH_TTL_SEC: '3600'
  WORKFLOW_APPROVAL_DEFAULT_TTL_SEC: '86400'
  WORKFLOW_APPROVAL_MAX_TTL_SEC: '172800'
  WORKFLOW_APPROVAL_EXPIRY_INTERVAL_MS: '60000'
  # Plugin Workload SDK platform rate limits (issue #348). This file is a
  # strategic-merge PATCH over the base ConfigMap (registered under patches:
  # in the minikube kustomization). A key omitted here inherits the BASE value
  # from deploy/base/control-plane/configmaps.yaml (the deploy-mirror test
  # pins base to the code defaults). All four keys are set explicitly so
  # minikube's effective values (150/120/600/600) are visible here. Per-run
  # SDK quotas are deprecated and ignored; limits are enforced over a
  # trailing 60s window (no fixed reset); once traffic slows below the limit
  # the window drains within ~60s — stepless recipes are never permanently
  # trapped.
  CONTROL_API_PLUGIN_SDK_NOTIFICATIONS_PER_MIN: "150"
  CONTROL_API_PLUGIN_SDK_PROMPTBRIDGE_PER_MIN: "120"
  CONTROL_API_PLUGIN_SDK_REQUEST_BUCKET_PER_MIN: "600"
  CONTROL_API_PLUGIN_SDK_PREAUTH_PER_MIN: "600"
  # OSS default: point at the shared registry so a self-hoster browses the
  # public catalog out of the box and can run the connect flow (register →
  # approve → claim) against it. self-hosted is the only mode that fits an OSS
  # deployment (managed = MCC-provisioned, not in this repo). Registry auth
  # turns on by itself once the connect flow completes and this deployment
  # holds machine credentials: there is no flag to set and no restart needed.
  # To run your OWN in-cluster registry instead, set CLERUM_REGISTRY_URL to
  # http://registry-api.registry.svc.cluster.local:8085. That URL is already
  # built into the allowlist, so no CLERUM_REGISTRY_URL_ALLOWLIST entry is
  # needed for it; the setting is only for any OTHER registry URL. The
  # allowlist applies to any explicitly self-hosted deployment with a registry
  # URL configured, regardless of whether auth is active, and control-api
  # refuses to start if the configured URL is not allowlisted.
  #
  # This key is the SINGLE definition of the registry URL for the whole
  # control plane: workflow-recipes projects it via configMapKeyRef in the BASE
  # Deployment (deploy/base/control-plane/workflow-recipes.yaml) instead of
  # keeping a second copy, so this overlay only supplies the value. Both
  # services must agree, because WRC decides which images are ours — and
  # therefore get the platform pull credential — by comparing the image host
  # against this URL's host. Change it here and WRC follows.
  CLERUM_REGISTRY_URL: 'https://registry.evenfire.ai'
  REGISTRY_CONNECTION_MODE: 'self-hosted'
  # The Publisher UI (Sidebar entry + /publisher route) defaults ON for every
  # deploy. It only surfaces for an org-bound, non-curator deploy (the control-ui
  # fails closed otherwise), so an unconnected self-hosted deploy still won't show
  # it. Set the line below to 'false' to hide it explicitly.
  # CONTROL_API_PUBLISHER_UI_ENABLED: 'false'
  CLERUM_ATTACHMENT_MAX_BYTES: '52428800'
