apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: profile-control-funnel
  name: profile-control-funnel
  namespace: profiles
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: profile-control-funnel
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # sha256 of the profile-control-funnel-nginx ConfigMap document. nginx.conf is
        # mounted with subPath, which never picks up ConfigMap updates, so a changed
        # config must change this template to roll the pods. Pinned by
        # control-api/test/network.gateway.intent.test.ts.
        evenfire.ai/nginx-config-sha256: "5f384142d47677f1612d415ebe92eb0107a4e5cbb5200c3b23a9ef15a67b3366"
      labels:
        app: profile-control-funnel
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginx:1.30.1-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 6
          periodSeconds: 12
          successThreshold: 1
          timeoutSeconds: 1
        name: nginx
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 8
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-config
          subPath: nginx.conf
        - mountPath: /tmp
          name: nginx-tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: profile-control-funnel-nginx
        name: nginx-config
      - emptyDir: {}
        name: nginx-tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: profile-control-funnel
  name: profile-control-funnel
  namespace: profiles
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: profile-control-funnel
  type: ClusterIP
