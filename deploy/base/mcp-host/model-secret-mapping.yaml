apiVersion: v1
kind: ConfigMap
metadata:
  name: clerum-model-secret-mapping
  namespace: mcp-host
  labels:
    app.kubernetes.io/part-of: clerum
    clerum.io/component: workflow-subsystem
# Maps an LLM provider to the (Secret, key) holding its API key.
#
# Format (new): key = "<provider>", value = "<secretName>/<keyName>".
# The credential is associated with the PROVIDER, not the model — every model
# of a provider resolves to the same API key (R1). K8s ConfigMap keys cannot
# contain "/", so the value encodes the (Secret, key) tuple as "secretName/keyName".
#
# Transitional dual-read: during this release the WRC broker looks up
# `configMap[provider]` first and falls back to the legacy `provider__model`
# key. The legacy per-model entries are removed here; the fallback is retired
# in the next release (see TODO(remove-legacy-mapping) in modelConfigHandler.ts).
data:
  openai:   "chatllm-api-keys/openai-api-key"
  claude:   "chatllm-api-keys/claude-api-key"
  zai:      "chatllm-api-keys/zai-api-key"
  bailian:  "chatllm-api-keys/bailian-api-key"
  # Google Vertex AI (R4): single secret slot, the service-account JSON.
  vertex:   "chatllm-api-keys/vertex-service-account-json"
  # NOTE: bedrock is intentionally NOT mapped here. The WRC secret-broker
  # transport is single-valued (one Secret key per provider), but Bedrock needs
  # two credential slots (aws-access-key-id + aws-secret-access-key). Until the
  # WRC configure transport carries the full slot set (see B1's limitation note
  # in workflowService), bedrock is unusable from the recipe path. Interactive
  # hosts (mcp-host direct) resolve bedrock's multi-slot credentials via the
  # ConfigStore, not this mapping.
