apiVersion: v1
kind: Secret
metadata:
  name: gfs-controller-db
  namespace: gfs
  labels:
    app.kubernetes.io/name: gfs-controller
    app.kubernetes.io/part-of: clerum
type: Opaque
# The connection-string key is intentionally NOT declared in this manifest. It
# is OWNED by the explicit `rotate-writer` mode of
# deploy/scripts/provision-gfs-db.sh, which grants LOGIN + password
# to the least-privilege gfs_controller role (created NOLOGIN by control-api
# migrations; resource/manifest writes required by GFSC, authorization reads,
# append-only audit, and never grant/share writes) and patches the real DSN
# into this Secret. Because the
# key is absent here, `kubectl apply` of the overlay can never clobber a
# provisioned DSN: the three-way merge only prunes keys present in
# last-applied-configuration, and the provisioning patch never lands there
# (issue #775). Fresh clusters fail loud instead: gfsc pods sit in
# CreateContainerConfigError (missing Secret key) until the explicit bootstrap
# rotation runs. Normal deploys never rotate this compatibility credential.
