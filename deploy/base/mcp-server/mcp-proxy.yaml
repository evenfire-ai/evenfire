apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: mcp-proxy
  namespace: mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-proxy
  namespace: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-proxy
  template:
    metadata:
      labels:
        app: mcp-proxy
    spec:
      automountServiceAccountToken: false
      serviceAccountName: mcp-proxy
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: mcp-proxy
        image: clerum/mcp-proxy:0.9.5
        ports:
        - containerPort: 8083
        env:
        - name: MCP_PROXY_PORT
          value: "8083"
        - name: HCC_API_URL
          value: http://host-context-controller-api-gateway.control-plane.svc.cluster.local:8081
        - name: HCC_POLL_INTERVAL
          value: "30000"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8083
          failureThreshold: 10
          periodSeconds: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: mcp-server
spec:
  selector:
    app: mcp-proxy
  ports:
  - port: 8083
    protocol: TCP
    targetPort: 8083
  type: ClusterIP
