apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: channel-reader-handoff-ingress
  namespace: channels
  labels:
    clerum.io/policy-type: service
spec:
  podSelector:
    matchLabels:
      app: channel-reader
      clerum.io/managed-by: host-context-controller
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 8099
      protocol: TCP
    from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: channels
      podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-approval-request-reader
