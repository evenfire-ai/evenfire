apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workflow-approval-request-reader-to-mcp-host
  namespace: channels
  labels:
    clerum.io/policy-type: service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: workflow-approval-request-reader
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sandbox-recipes
      podSelector:
        matchLabels:
          clerum.io/component: workflow-mcp-host
          clerum.io/managed-by: wrc
