apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - networkpolicies.yaml
  # configmaps.yaml is NOT included — it contains a placeholder value for
  # clerum-wrc-public-key that would overwrite the real PEM key on every
  # kubectl apply. The ConfigMap is created by deploy/scripts/gen-jwt-keys.sh
  # (step 10/10) with the actual key derived from the WRC signing secret.
  - workflow-output-pvc.yaml
