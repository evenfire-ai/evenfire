apiVersion: clerum.io/v1alpha1
kind: PublicEgressExceptionSet
metadata:
  name: public-egress-exceptions
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  # Canonical non-public/reserved CIDR exclusions for policies that allow
  # dynamic public internet egress with explicit ports.
  # Scope is rule-level: these exclusions belong on 0.0.0.0/0 public egress
  # rules. They do not imply the selected workload is external-only; legitimate
  # internal traffic must stay in separate named selector/CIDR policies.
  ranges:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.31.196.0/24
    - 192.52.193.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 192.175.48.0/24
    - 198.18.0.0/15
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 240.0.0.0/4
