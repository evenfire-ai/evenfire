apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-context-controller-api-gateway
  namespace: control-plane
  labels:
    app: host-context-controller-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host-context-controller-api-gateway
  template:
    metadata:
      labels:
        app: host-context-controller-api-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginx:1.30.1-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-tmp
          mountPath: /tmp
      volumes:
      - name: nginx-config
        configMap:
          name: host-context-controller-api-gateway
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: host-context-controller-api-gateway
  namespace: control-plane
  labels:
    app: host-context-controller-api-gateway
spec:
  type: ClusterIP
  selector:
    app: host-context-controller-api-gateway
  ports:
  - name: http
    port: 8081
    targetPort: http
    protocol: TCP
