apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-ui
  namespace: control-plane
  labels:
    app: control-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-ui
  template:
    metadata:
      labels:
        app: control-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: control-ui
        image: clerum/control-ui:0.9.5
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: CONTROL_API_INTERNAL_URL
          value: http://control-api.control-plane.svc.cluster.local:8090
        # Server-side control-ui proxy timeout in milliseconds (see
        # app/control-api/[...path]/route.ts). Intended to keep large GFS uploads (file
        # sent base64-encoded, ~+33%) from being cut mid-body over the Cloudflare tunnel;
        # applies only to body-bearing methods, so SSE streams are unaffected.
        # NOTE: currently LATENT — /control-api/* is served by the next.config.js rewrite,
        # not this route handler, so this value does not govern prod today. It takes
        # effect once the proxy is consolidated onto the handler (tracked follow-up); the
        # client-side upload timeout in control-ui/lib/api.ts is what unblocks prod now.
        - name: CONTROL_API_PROXY_TIMEOUT_MS
          value: "300000"
        - name: CONTROL_UI_PUBLIC_TOKEN_CSRF_SECRET
          valueFrom:
            secretKeyRef:
              name: control-ui-secrets
              key: CONTROL_UI_PUBLIC_TOKEN_CSRF_SECRET
        livenessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 8
          periodSeconds: 12
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 4
          periodSeconds: 8
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: control-ui
  namespace: control-plane
  labels:
    app: control-ui
spec:
  type: ClusterIP
  selector:
    app: control-ui
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
