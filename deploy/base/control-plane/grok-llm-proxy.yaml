apiVersion: v1
kind: ServiceAccount
metadata:
  name: grok-llm-proxy
  namespace: control-plane
  labels:
    app: grok-llm-proxy
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grok-llm-proxy-config
  namespace: control-plane
  labels:
    app: grok-llm-proxy
data:
  GROK_LLM_PROXY_RUNTIME_PORT: "8080"
  GROK_LLM_PROXY_ADMIN_PORT: "8081"
  GROK_LLM_PROXY_PROBE_PORT: "9090"
  GROK_LLM_PROXY_MAX_STREAM_DURATION_MS: "1800000"
  GROK_LLM_PROXY_MAX_DEADLINE_MS: "1800000"
  GROK_LLM_PROXY_JWT_ISSUER: control-api
  GROK_LLM_PROXY_EXECUTION_ENABLED: "false"
  GROK_LLM_PROXY_CONTROL_API_URL: http://control-api-rpc-gateway.control-plane.svc.cluster.local:8090/api/v1
  GROK_LLM_PROXY_CONTROL_API_SERVICE: grok-llm-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grok-llm-proxy
  namespace: control-plane
  labels:
    app: grok-llm-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: grok-llm-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: grok-llm-proxy
    spec:
      serviceAccountName: grok-llm-proxy
      automountServiceAccountToken: false
      # On SIGTERM the proxy waits for its open streams (#739 D6): the stream
      # cap (GROK_LLM_PROXY_MAX_STREAM_DURATION_MS / 1000) plus 60 s for
      # redeem and finalize. The deploy-contract script derives this value.
      terminationGracePeriodSeconds: 1860
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grok-llm-proxy
          image: clerum/grok-llm-proxy:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: grok-llm-proxy-config
          env:
            - name: GROK_LLM_PROXY_JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: control-api-public-key
                  key: CONTROL_API_PUBLIC_KEY_PEM
            - name: GROK_LLM_PROXY_CONTROL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grok-llm-proxy-secrets
                  key: GROK_LLM_PROXY_CONTROL_API_TOKEN
            # Caps V8's old space well under the 768Mi limit, so heap growth
            # is bounded and collected before the kernel kills the pod. The
            # cap does not lower the peak: with three 8 MiB bodies in flight,
            # RSS measured 249-292 MiB with it and 230-252 MiB without it
            # (one run per mode).
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          ports:
            - name: runtime
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            initialDelaySeconds: 4
            periodSeconds: 8
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 8
            periodSeconds: 12
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grok-llm-proxy
  namespace: control-plane
  labels:
    app: grok-llm-proxy
spec:
  type: ClusterIP
  selector:
    app: grok-llm-proxy
  ports:
    - name: runtime
      port: 8080
      protocol: TCP
      targetPort: runtime
    - name: admin
      port: 8081
      protocol: TCP
      targetPort: admin
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
