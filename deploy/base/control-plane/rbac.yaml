# control-api needs Secret CRUD in its own namespace only.
# Cluster-wide Secret access was removed from the ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-secrets-role
  namespace: control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-api-secrets-binding
  namespace: control-plane
subjects:
- kind: ServiceAccount
  name: control-api
  namespace: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-api-secrets-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-recipes-control-plane
  namespace: control-plane
rules:
  # V7 fix: remove "list" — K8s ignores resourceNames for list verbs,
  # so list+resourceNames would allow listing ALL secrets in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["clerum-wrc-signing-key"]
  # Workflow trigger token Secrets — dynamic names (wf-*-trigger-token, wf-*-coordinator-token)
  # K8s does not support wildcard resourceNames, so this rule has no resourceNames restriction.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # V6 fix: scope configmaps access to only the resources WRC manages
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
    resourceNames: ["clerum-wrc-public-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-recipes-control-plane
  namespace: control-plane
subjects:
- kind: ServiceAccount
  name: workflow-recipes
  namespace: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-recipes-control-plane
---
# Lets the CI/e2e service account READ NetworkPolicies in control-plane so the
# registry-decoupling compat suite can verify the consumer egress NPs exist.
# Without this, the suite's `kubectl get networkpolicy` returns a permission
# error that the suite swallows as "missing" — false-failing every registry
# deploy (the SA can port-forward but lacked networkpolicies:get). Read-only,
# scoped to this one resource + namespace.
#
# NOTE: subject is a GCP service account mapped to a k8s User. CONFIRM this is
# the repo's GCP_SERVICE_ACCOUNT (identified from the GKE audit log as the
# principal doing pods.portforward/deployments.patch on example-dev).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-compat-networkpolicy-reader
  namespace: control-plane
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
# issue #299 Phase 2: provider-netblocks catalog. This Role is NAME-scoped to the
# ONE CM (get/update/patch on clerum-provider-netblocks) and adds `patch` as the
# only genuinely new authority. `create` cannot carry resourceNames (K8s authz
# evaluates create before the name exists); the seed ships in deploy/base so
# create is only the fresh-cluster path.
# NOTE (not the effective-SA property): the control-api ServiceAccount ALSO holds
# `control-api-secrets-role` (see control-api-secrets-binding above), which already
# grants namespace-wide configmaps get/list/create/update. So this scoped Role does
# NOT narrow the SA's effective ConfigMap authority — it documents intent. Truly
# isolating the fetcher (a dedicated SA bound only to this Role, or splitting the
# broad pre-existing role) is tracked separately; that broad grant is pre-existing
# (control-api legitimately needs it for other duties), not introduced by this PR.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-provider-netblocks-writer
  namespace: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["clerum-provider-netblocks"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-api-provider-netblocks-writer
  namespace: control-plane
subjects:
  - kind: ServiceAccount
    name: control-api
    namespace: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-api-provider-netblocks-writer
---
# WRC reads the catalog on its existing resync. This is a NEW sibling Role
# (create-only for CD) rather than a rule appended to the pre-existing
# workflow-recipes-control-plane Role above: the CD service account lacks
# roles.patch (see deploy/scripts/bootstrap-rbac.sh), so mutating an existing
# Role would fail the first CD apply until an operator re-runs the bootstrap.
# Creating a fresh Role/RoleBinding needs no patch. Mirrors the HCC reader below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-recipes-provider-netblocks-reader
  namespace: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["clerum-provider-netblocks"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-recipes-provider-netblocks-reader
  namespace: control-plane
subjects:
  - kind: ServiceAccount
    name: workflow-recipes
    namespace: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-recipes-provider-netblocks-reader
---
# HCC reads the catalog on its existing resync (no HCC ConfigMap Role exists in
# control-plane today).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: host-context-controller-provider-netblocks-reader
  namespace: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["clerum-provider-netblocks"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: host-context-controller-provider-netblocks-reader
  namespace: control-plane
subjects:
  - kind: ServiceAccount
    name: host-context-controller
    namespace: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: host-context-controller-provider-netblocks-reader
