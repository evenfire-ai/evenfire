# Inter-service token Secrets — DELIBERATELY EMPTY in base.
#
# Base ships `stringData: {}` as a loud canary. Any pod that needs real secrets
# (control-api, workflow-recipes, host-context-controller) will fail to start
# until an out-of-band script populates the Secrets via
# `kubectl patch --type=merge`, which writes keys OUTSIDE the
# `last-applied-configuration` envelope. That is why
# subsequent `kubectl apply -k` runs do NOT wipe the values back to empty.
#
# Populated by `deploy/scripts/apply-inter-service-tokens.sh` (CI + operator
# workstations) BEFORE `kubectl apply -k` runs. See the comment block in
# `.github/workflows/deploy-dev.yaml` where the script is invoked.
#
# Pattern: base ships empty stringData {}; script populates real values via
# `kubectl patch --type=merge` (outside the apply envelope, so re-applies are no-ops).
---
apiVersion: v1
kind: Secret
metadata:
  name: control-api-internal-tokens
  namespace: control-plane
  labels:
    app: control-api
type: Opaque
# Populated keys (via kubectl patch, NOT kubectl apply):
#   CONTROL_API_INTERNAL_SERVICE_TOKENS  — comma-separated "service=token" pairs
#   CONTROL_API_INTERNAL_TOKENS          — comma-separated raw token list
#   CONTROL_API_MEMBER_REGISTRATION_HMAC_SECRET
#                                         — per-tenant HS256 secret control-api uses
#                                           to sign JWTs for member-registration-service
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: codex-llm-proxy-secrets
  namespace: control-plane
  labels:
    app: codex-llm-proxy
type: Opaque
# Populated keys (via kubectl patch, NOT kubectl apply):
#   CODEX_LLM_PROXY_CONTROL_API_TOKEN — dedicated redeem/finalize token
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: internal-control-jwt-secrets
  namespace: control-plane
  labels:
    app.kubernetes.io/part-of: clerum
type: Opaque
# Populated keys (via kubectl patch, NOT kubectl apply):
#   INTERNAL_CONTROL_JWT_WRC_HMAC_SECRET — HS256 secret for WRC issuer
#   INTERNAL_CONTROL_JWT_HCC_HMAC_SECRET — HS256 secret for HCC issuer
stringData: {}
