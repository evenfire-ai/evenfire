apiVersion: v1
kind: ConfigMap
metadata:
  name: control-api-config
  namespace: control-plane
  labels:
    app: control-api
data:
  CONTROL_API_PORT: '8090'
  CONTROL_API_JSON_BODY_LIMIT: 150mb
  CONTROL_API_PG_CONNECTION_STRING: postgres://postgres:postgres@control-postgres.control-plane.svc.cluster.local:5432/profiles
  CONTROL_API_NAMESPACE: mcp-server
  CONTROL_API_HOSTS_NAMESPACE: mcp-host
  CONTROL_API_CONTEXTS_NAMESPACE: mcp-server
  CONTROL_API_MCP_SERVERS_NAMESPACE: mcp-server
  CONTROL_API_COMMUNICATION_CHANNELS_NAMESPACE: channels
  CONTROL_API_SECRETS_NAMESPACE: mcp-host
  CONTROL_API_JWT_ISSUER: control-api
  CONTROL_API_JWT_AUDIENCE: dev-profile-ui
  CONTROL_API_RPC_JWT_ISSUER: control-api
  CONTROL_API_RPC_JWT_AUDIENCE: rpc-proxy
  CONTROL_API_RPC_TOKEN_TTL_SECONDS: '300'
  CONTROL_API_ADMIN_JWT_ISSUER: control-api
  CONTROL_API_ADMIN_JWT_AUDIENCE: control-ui
  CONTROL_API_ADMIN_JWT_TTL_SECONDS: '3600'
  CONTROL_API_ADMIN_BOOTSTRAP_USERNAME: admin
  CONTROL_API_ADMIN_BOOTSTRAP_EMAIL: ''
  CONTROL_API_ADMIN_AUTH_MAX_FAILURES: '5'
  CONTROL_API_ADMIN_AUTH_LOCK_MINUTES: '15'
  CONTROL_API_POLICY_AUTH_AUDIENCE: control-api
  TRACING_APPROVAL_PROMPT_HISTORY_ENABLED: 'false'
  TRACING_APPROVAL_PROMPT_HISTORY_MAX_BYTES: '16384'
  TRACING_APPROVAL_PROMPT_HISTORY_RETENTION_DAYS: '30'
  TRACING_APPROVAL_PROMPT_HISTORY_KEY_VERSION: 'v1'
  CONTROL_API_GOOGLE_CLIENT_ID: replace-with-google-client-id.apps.googleusercontent.com
  # member-registration-service runs as an extracted sibling in the `registration`
  # namespace locally (and centrally at https://registration.evenfire.ai — the
  # gcp overlays override this BASE_URL to the hub). control-api authenticates
  # with a per-tenant HMAC JWT (HMAC secret + kid + tenant id), so there is no
  # static SERVICE_TOKEN/SERVICE_NAME for this hop anymore.
  CONTROL_API_MEMBER_REGISTRATION_SERVICE_BASE_URL: http://member-registration-service.registration.svc.cluster.local:8092/api/v1
  CONTROL_API_DESKTOP_EXTERNAL_REST_API_BASE_URL: http://127.0.0.1:8091
  CONTROL_API_DESKTOP_RPC_PROXY_BASE_URL: http://127.0.0.1:8094
  CONTROL_API_DESKTOP_PROFILE_UI_BASE_URL: http://127.0.0.1:3001
  CONTROL_API_DESKTOP_APP_NAME: Evenfire
  # Inter-service tokens were removed from this ConfigMap on purpose: they now
  # live in the `control-api-internal-tokens` Secret (base canary + patched
  # out-of-band). The member-registration HMAC secret
  # (CONTROL_API_MEMBER_REGISTRATION_HMAC_SECRET) is patched there too.
  # Kustomize overlays no longer need to patch those token keys.
  # See `deploy/base/control-plane/secrets-canary.yaml`.
  WORKFLOW_APPROVAL_ACCESS_TTL_SEC: '600'
  WORKFLOW_APPROVAL_REFRESH_TTL_SEC: '3600'
  WORKFLOW_APPROVAL_DEFAULT_TTL_SEC: '86400'
  WORKFLOW_APPROVAL_NOTIFICATION_DELIVERY_ENABLED: "true"
  WORKFLOW_APPROVAL_NOTIFICATION_DELIVERY_INTERVAL_MS: "5000"
  WORKFLOW_APPROVAL_NOTIFICATION_DELIVERY_BATCH_SIZE: "10"
  APPROVAL_RL_REQUEST_PER_MIN: "120"
  # Hard ceiling for caller-provided ttlSeconds. Defaults to 48h so a client
  # asking for ttlSeconds=604800 (code default) can't freeze a workflow step
  # for a full week. Overlays may tighten further for stricter environments.
  WORKFLOW_APPROVAL_MAX_TTL_SEC: "172800"
  WORKFLOW_APPROVAL_EXPIRY_INTERVAL_MS: "60000"
  # Terminal approvals are retained in the live table for 180 days, then
  # copied to workflow_approval_requests_archive by the daily archive cron.
  APPROVAL_RETENTION_DAYS: "180"
  APPROVAL_ARCHIVE_BATCH_SIZE: "500"
  # TTL for mcpHostJwt control tokens used by runtime mcp-host workflow triggers.
  MCP_HOST_JWT_CONTROL_TTL_SEC: "600"
  CLERUM_WORKFLOW_MAX_WORKLOADS_PER_RECIPE: "25"
  CLERUM_WORKFLOW_UI_EGRESS_INTERNAL_MAX_ITEMS: "25"
  CLERUM_WORKFLOW_MAX_STEPS: "100"
  CLERUM_WORKFLOW_STEP_DEPENDS_ON_MAX_ITEMS: "100"
  CLERUM_WORKFLOW_STEP_ALLOWED_TOOLS_MAX_ITEMS: "50"
  CLERUM_WORKFLOW_STEP_MCP_SERVERS_MAX_ITEMS: "20"
  CLERUM_ATTACHMENT_MAX_BYTES: "52428800"
  # Plugin image-host allowlist (Phase 2.3) — audit mode by default. Base ships a
  # vendor-neutral default; environment overlays override this with the image
  # prefixes for their own registry.
  CONTROL_API_ALLOWED_IMAGE_PREFIXES: "ghcr.io/evenfire-ai/,mongodb/,mcr.microsoft.com/,clerum/"
  CONTROL_API_ENFORCE_IMAGE_ALLOWLIST: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-api-rpc-gateway
  namespace: control-plane
  labels:
    app: control-api-rpc-gateway
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      upstream control_api_upstream {
        server control-api.control-plane.svc.cluster.local:8090;
      }

      server {
        listen 8090;
        server_name _;

        location = /health {
          return 200 '{"status":"ok"}';
          add_header Content-Type application/json;
        }

        location ~ ^/api/v1/rpc/access/users/[^/]+/mcp-servers$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/rpc/access/users/[^/]+/mcp-hosts/[^/]+$ {
          limit_except GET POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stateless Agents — wake trigger for a suspended/draining host.
        # rpc-proxy forwards the caller's rpc access token; control-api
        # authorizes via requireRpcTokenHostMatch before any mutation.
        location ~ ^/api/v1/rpc/hosts/[^/]+/wake$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spec §9.2 — sandbox-ui app picker (rpc-proxy fans out per-user
        # ACL lookup). control-api authenticates the call via
        # requireInternalService('rpc-proxy').
        location = /api/v1/internal/sandbox-ui/apps {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spec §10 — sandbox-ui registry resolution; rpc-proxy hits
        # this on /session mint to resolve recipe → upstream Service.
        location ~ ^/api/v1/internal/sandbox-ui/registry/[^/]+/[^/]+$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Per-user OAuth background-consent bridge (rpc-proxy → control-api), all
        # gated server-side by requireInternalService('rpc-proxy'). The sandbox-ui
        # "Connect" embed POSTs authorize-url to start consent, POSTs token to
        # exchange the code, and DELETEs grant to disconnect. Each MUST be
        # allowlisted here or rpc-proxy is 403'd at the edge. The control-api test
        # `network/gateway intent` derives this list from the routes and fails CI
        # if a requireInternalService('rpc-proxy') route lacks a location.
        location = /api/v1/internal/sandbox-ui/oauth/authorize-url {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/internal/sandbox-ui/oauth/token {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/internal/sandbox-ui/oauth/grant {
          limit_except DELETE {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          return 403;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-workflow-approval-gateway
  namespace: control-plane
  labels:
    app: nginx-workflow-approval-gateway
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      log_format workflow_gateway_json escape=json
        '{"gateway":"workflow-approval","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"upstream_status":"$upstream_status","request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
      access_log /dev/stdout workflow_gateway_json;
      error_log /dev/stderr warn;

      upstream control_api_upstream {
        server control-api.control-plane.svc.cluster.local:8090;
      }

      server {
        listen 8092;
        server_name _;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location = /health {
          return 200 '{"status":"ok"}';
          add_header Content-Type application/json;
        }

        # Runtime gateway only; provisioner issuance bypasses this route.

        location = /api/v1/workflow-approval-mediums/resolve {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-approval-mediums/link-sessions/confirm {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-approval-notifications/deliveries {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-approvals/pending/resolve {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-approval-mediums/telegram/challenges/confirm-provider-event {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflow-approval-notifications/deliveries/[^/]+/(ack|fail)$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-auth/refresh {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header x-service-token $http_x_service_token;
        }

        # Runtime token recovery, not provisioner issuance.
        location = /api/v1/workflow-auth/reissue {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header x-service-token $http_x_service_token;
        }

        # OAuth mcp-server broker (mcp-host → control-api), spec 06 §5.1/§10.6
        # decision B: reach the broker by reusing THIS gateway instead of opening
        # a direct mcp-host → control-api:8090 egress. L7-scoped to POST-only on
        # this single path — the DENY-by-omission of every other control-api path
        # (incl. direct :8090) is preserved. mcp-host forwards its control JWT
        # (typ:service, scope oauth:user-token) in Authorization; no x-service-token.
        location = /api/v1/mcp-oauth/user-token {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflow-approvals/request {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header x-service-token $http_x_service_token;
        }

        location ~ ^/api/v1/workflow-approvals/[^/]+/status$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header x-service-token $http_x_service_token;
        }

        location ~ ^/api/v1/workflow-approvals/[^/]+/cancel$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header x-service-token $http_x_service_token;
        }

        location ~ ^/api/v1/workflow-approvals/[^/]+/provider-decision$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── LLM usage events ingest ──
        # mcp-host pods POST batched LLM usage events here. Same RS256
        # access JWT that the workflow-approvals endpoints accept.
        location = /api/v1/internal/usage/llm/events {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Governed agent-run tracing ingest ──
        # Shared and workflow mcp-host pods POST bounded event batches here
        # using the same RS256 runtime access JWT as usage and approvals.
        location = /api/v1/internal/tracing/agent-run-events {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Protected approval prompt-history capture ──
        # mcp-host pods POST one bounded prompt capture for an existing
        # approval using the same RS256 runtime access JWT as tracing ingest.
        location = /api/v1/internal/tracing/approval-prompt-history {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Token budget check + reservation release ──
        # mcp-host pods POST here once per task (pre-task budget enforcement)
        # and to release danger-zone reservations on task terminal. Same RS256
        # runtime access JWT that the workflow-approvals + usage endpoints accept.
        location = /api/v1/internal/budgets/check {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/internal/budgets/release {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Plugin Workload SDK runtime endpoints ──
        # Recipe mcp-host pods proxy plugin-workload SDK calls (promptBridge +
        # clientNotifications) to control-api through this gateway. Same RS256
        # runtime access JWT that the workflow-approvals endpoints accept;
        # control-api authorizes each call against the recipe grant.
        location = /api/v1/mcp-host/plugin-workload-sdk/capabilities {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/mcp-host/plugin-workload-sdk/prompt-bridge/v2 {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/mcp-host/plugin-workload-sdk/prompt-bridge {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # JIT credential tickets are issued immediately before each
        # provider attempt (including an ordered fallback target). Keep this
        # route on the same mcp-host JWT gateway as the initial authorization;
        # otherwise promptBridge authorizes successfully and then fails at
        # the gateway before the provider or credential broker is reached.
        location = /api/v1/mcp-host/plugin-workload-sdk/prompt-bridge/credential-ticket {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/mcp-host/plugin-workload-sdk/client-notification {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # Read-only: list the clientNotifications grant's allowed recipients so a
        # recipe sandbox UI can populate its notify dropdown. POST carries the
        # recipe binding in the body (same contract as the send path above).
        location = /api/v1/mcp-host/plugin-workload-sdk/client-notification/recipients {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/mcp-host/plugin-workload-sdk/invocations/[^/]+/status$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # SDK-only promptBridge finalization is the atomic accounting boundary:
        # it closes the physical provider attempt, logical invocation, and
        # exact/unknown spend outcome in one control-api transaction. Keep it
        # behind the same mcp-host JWT gateway as invocation status; omitting
        # this route lets the provider execute while the runtime can only
        # surface provider_unavailable after the result is already billable.
        location ~ ^/api/v1/mcp-host/plugin-workload-sdk/invocations/[^/]+/finalize$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # Provider-attempt status is part of the promptBridge audit contract.
        # It must remain behind the same mcp-host JWT gateway as invocation
        # status; otherwise the provider call can be authorized and issued a
        # JIT ticket, but the runtime cannot close the attempt lease.
        location ~ ^/api/v1/mcp-host/plugin-workload-sdk/provider-attempts/[^/]+/status$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Stateless lifecycle heartbeat ──
        # mcp-host pods POST D8 activity snapshots here. Same RS256 runtime
        # access JWT that the workflow-approvals endpoints accept; control-api
        # binds identity to the token's hostRefs[0] claim (never the path) and
        # answers {drain} from Host.status.lifecycle.
        location = /api/v1/mcp-host/hosts/heartbeat {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        # ── Workflow broker runtime endpoints ──

        location = /api/v1/workflows {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/workflows/effective-targets/resolve {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+/health$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/runs/[^/]+/artifacts$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/runs/[^/]+/artifacts/[^/]+/download$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+/runs/latest/artifacts$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+/runs/latest/artifacts/[^/]+/content$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+/runs/latest/artifacts/[^/]+/download$ {
          limit_except GET {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v1/workflows/[^/]+/[^/]+/trigger$ {
          limit_except POST {
            deny all;
          }
          proxy_pass http://control_api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        location / {
          return 403;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: host-context-controller-api-gateway
  namespace: control-plane
  labels:
    app: host-context-controller-api-gateway
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      upstream host_context_controller_upstream {
        server host-context-controller.control-plane.svc.cluster.local:8081;
      }

      server {
        listen 8081;
        server_name _;

        location = /health {
          add_header Content-Type application/json;
          return 200 '{"status":"ok"}';
        }

        location = /ready {
          proxy_pass http://host_context_controller_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/mcpservers {
          proxy_pass http://host_context_controller_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/mcpservers/context/[^/]+$ {
          proxy_pass http://host_context_controller_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/mcpservers/[^/]+/auth$ {
          proxy_pass http://host_context_controller_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/desktop/[^/]+$ {
          proxy_pass http://host_context_controller_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          return 403;
        }
      }
    }
