apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - public-egress-exceptions.yaml
  - namespaces.yaml
  - cluster-wide
  - control-plane
  - mcp-host
  - mcp-server
  - llm-hooks
  - channels
  - profiles
  - rpc-proxy
  - sandbox-recipes
  - sandbox-ui
  - webhook-ingress
  - gfs
  # deploy/base/ingress/ is intentionally NOT listed here — the Cloudflare Tunnel
  # stack is opt-in: your production overlay adds `- ../../base/ingress` (see
  # docs/deploy/production.md), so the minikube overlay never inherits an
  # unconfigurable cloudflared pod.

configurations:
  - kustomizeconfig/desktop-profile-ui-origin.yaml

# Kustomize replacements from a base run before parent-overlay patches. This
# delayed variable resolves the final source ConfigMap after overlay assembly.
vars:
  - name: CONTROL_API_DESKTOP_PROFILE_UI_BASE_URL
    objref:
      apiVersion: v1
      kind: ConfigMap
      name: control-api-config
      namespace: control-plane
    fieldref:
      fieldpath: data.CONTROL_API_DESKTOP_PROFILE_UI_BASE_URL

replacements:
  - source:
      group: clerum.io
      version: v1alpha1
      kind: PublicEgressExceptionSet
      name: public-egress-exceptions
      fieldPath: spec.ranges
    targets:
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: workflow-approval-request-reader-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: channel-reader-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: mcp-host
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: rpc-proxy
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: member-registration-service
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: control-api-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: workflow-recipes-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: codex-llm-proxy-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: grok-llm-proxy-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
