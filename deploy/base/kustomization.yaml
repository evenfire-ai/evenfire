apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - public-egress-exceptions.yaml
  - namespaces.yaml
  - cluster-wide
  - control-plane
  - mcp-host
  - mcp-server
  - channels
  - profiles
  - rpc-proxy
  - sandbox-recipes
  - sandbox-ui
  - webhook-ingress
  - gfs
  # deploy/base/ingress/ is intentionally NOT listed here — the Cloudflare Tunnel
  # stack is opt-in per GKE overlay (gcp-prod/gcp-dev add `- ../../base/ingress`),
  # so the minikube overlay never inherits an unconfigurable cloudflared pod.

replacements:
  - source:
      group: clerum.io
      version: v1alpha1
      kind: PublicEgressExceptionSet
      name: public-egress-exceptions
      fieldPath: spec.ranges
    targets:
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: workflow-approval-request-reader-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: channel-reader-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: mcp-host
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: rpc-proxy
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: member-registration-service
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: control-api-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
      - select:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          name: workflow-recipes-external-egress
        fieldPaths:
          - spec.egress.*.to.*.ipBlock.except
