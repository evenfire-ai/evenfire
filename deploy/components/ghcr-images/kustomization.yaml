    newTag: v0.6.0
  - name: clerum/control-ui
    newName: ghcr.io/evenfire-ai/control-ui
    newTag: v0.6.0
  - name: clerum/external-rest-api
    newName: ghcr.io/evenfire-ai/external-rest-api
    newTag: v0.6.0
  - name: clerum/host-context-controller
