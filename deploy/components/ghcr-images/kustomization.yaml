# Rewrites every pull_in_ghcr_mode image (deploy/images.json:
# published && deployed_to_minikube) from its local clerum/* name to its
# published ghcr.io/evenfire-ai counterpart at the pinned release tag.
# Consumed by deploy/overlays/minikube-ghcr and minikube-no-uis-ghcr.
#
# THE ROW SET IS NOT A FREE CHOICE. It is exactly pullInGhcrMode() from
# scripts/release/images-manifest.mjs, enforced in both directions by
# scripts/tests/test-ghcr-component.sh. An extra row is not harmless: adding
# clerum/workflow-custom-sdk-e2e here rewrites the WRC tag-prefix allowlist
# value "clerum/workflow-custom-sdk-e2e:" into
# "ghcr.io/evenfire-ai/workflow-custom-sdk-e2e:v0.6.0", appending a tag and
# silently breaking the prefix match against the locally built fixture.
#
# imagetags.yaml below is a MANDATORY byte-identical copy of
# ../../overlays/minikube/kustomizeconfig/imagetags.yaml. Kustomize refuses a
# component whose `configurations:` file lives outside the component directory
# ("security; file ... is not in or below ..."), and `kubectl apply -k` has no
# --load-restrictor escape. The copy is drift-guarded by the harness.
#
# newTag is THE release pointer coordinate. It is written by
# scripts/release/prepare-release.mjs at release-cut time and checked by
# scripts/release/validate-release-tag.mjs. Never hand-edit it, and never
# commit a moving tag here -- MINIKUBE_IMAGE_TAG overrides it at render time
# in a temp copy instead (scripts/minikube/full-setup.sh).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configurations:
  - imagetags.yaml

images:
  - name: clerum/channel-reader
    newName: ghcr.io/evenfire-ai/channel-reader
    newTag: v0.6.0
  - name: clerum/workflow-approval-request-reader
    newName: ghcr.io/evenfire-ai/workflow-approval-request-reader
    newTag: v0.6.0
  - name: clerum/control-api
