apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: e2e-layer3a-snippet-negative-platform-secret
  namespace: sandbox-recipes
spec:
  triggers:
    onDemand: {}
  steps:
    - id: snippet
      run:
        type: snippet
        language: typescript
        code: |
          return sdk.secrets.get("wrc_token")
        capabilities:
          secrets:
            - alias: wrc_token
              secretRef:
                name: wf-e2e-layer3a-snippet-negative-platform-secret-coordinator-token
                key: wrc-token
