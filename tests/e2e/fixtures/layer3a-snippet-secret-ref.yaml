apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: e2e-layer3a-snippet-secret-ref
  namespace: sandbox-recipes
spec:
  triggers:
    onDemand: {}
  output:
    destination: pvc
    format: multi
    storageSize: 64Mi
  steps:
    - id: read-secret
      run:
        type: snippet
        language: typescript
        code: |
          const token = sdk.secrets.get("vendor_api_key")
          const payload = {
            source: "secretRef",
            tokenPresent: Boolean(token),
            tokenLength: token.length,
            tokenPrefix: token.slice(0, 4),
          }
          const artifact = await sdk.artifacts.writeJson("secret-ref-result.json", payload)
          return { ...payload, artifact }
        capabilities:
          secrets:
            - alias: vendor_api_key
              secretRef:
                name: e2e-layer3a-snippet-secret-ref-secret
                key: apiKey
