apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: e2e-layer3a-snippet-negative-missing-secret
  namespace: sandbox-recipes
spec:
  triggers:
    onDemand: {}
  steps:
    - id: read-missing-secret
      run:
        type: snippet
        language: typescript
        code: |
          const token = sdk.secrets.get("missing_token")
          return { tokenPresent: Boolean(token) }
        capabilities:
          secrets:
            - alias: missing_token
              secretRef:
                name: e2e-layer3a-snippet-missing-secret
                key: apiKey
