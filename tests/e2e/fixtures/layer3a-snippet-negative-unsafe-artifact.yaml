apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: e2e-layer3a-snippet-negative-unsafe-artifact
  namespace: sandbox-recipes
spec:
  triggers:
    onDemand: {}
  output:
    destination: pvc
    format: json
    storageSize: 128Mi
  steps:
    - id: snippet
      run:
        type: snippet
        language: typescript
        code: |
          return await sdk.artifacts.writeJson("../escape.json", { unsafe: true })
        capabilities: {}
