apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: channels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 1143
              name: imap
            - containerPort: 8025
              name: web
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '200m'
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: channels
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: imap
      port: 1143
      targetPort: 1143
    - name: web
      port: 8025
      targetPort: 8025
