apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: e2e-layer3a-snippet-manual-mcp-timeout
  namespace: sandbox-recipes
spec:
  triggers:
    onDemand: {}
  description: Layer 3A snippet runtime manual MCP SDK call bounded timeout fixture.
  contextRef: context1
  security:
    allowContextRef: true
  workloads:
    - id: mock-tools
      type: deployment
      image: clerum/mock-mcp-server:test
      port: 3000
      transport:
        type: streamableHttp
        path: /mcp
      healthCheck:
        type: tcp
        port: 3001
      resources:
        requests:
          cpu: '50m'
          memory: '64Mi'
        limits:
          cpu: '200m'
          memory: '128Mi'
  inputs:
    requestId: layer3a-manual-mcp-timeout
  output:
    destination: pvc
    format: json
    storageSize: 128Mi
  steps:
    - id: call-hanging-mcp
      timeoutSeconds: 2
      run:
        type: snippet
        language: typescript
        code: |
          return await sdk.mcp.callTool("mock-tools", "hang", { durationMs: 120000 })
        capabilities:
          mcp:
            servers: [mock-tools]
            allowedTools:
              include: [mock-tools__hang]
