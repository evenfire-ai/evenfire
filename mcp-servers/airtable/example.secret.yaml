apiVersion: v1
kind: Secret
metadata:
  name: mcp-airtable-credentials
  namespace: mcp-server
  labels:
    app: mcp-airtable
type: Opaque
data:
  # Base64-encoded Airtable personal access token
  # To encode: echo -n "patXXX.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" | base64
  api-key: "<BASE64_ENCODED_AIRTABLE_API_KEY>"
