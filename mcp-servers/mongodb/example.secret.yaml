apiVersion: v1
kind: Secret
metadata:
  name: mcp-mongodb-credentials
  namespace: mcp-server
  labels:
    app: mcp-mongodb
type: Opaque
data:
  # Base64-encoded MongoDB connection string
  # To encode: echo -n "mongodb+srv://user:password@cluster.mongodb.net/mydb" | base64
  connection-string: '<BASE64_ENCODED_CONNECTION_STRING>'
