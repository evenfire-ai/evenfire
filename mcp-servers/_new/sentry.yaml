# Sentry MCP — remote MCP wrapper (Category A)
#
# Official remote MCP: https://mcp.sentry.dev/mcp (Streamable HTTP)
# Docs: https://github.com/getsentry/sentry-mcp
#
# Auth: pass an upstream Sentry user auth token directly via the Sentry-Bearer
# scheme (intentionally NOT "Bearer" — that scheme is reserved for MCP OAuth
# tokens): Authorization: Sentry-Bearer <token>. Token scopes per Sentry docs:
# org:read, project:read, project:write, team:read, team:write, event:write.
#
# Secret must exist BEFORE the MCP handshake works:
#   kubectl --context=dev create secret generic sentry-credentials \
#     -n mcp-server --from-literal=SENTRY_ACCESS_TOKEN=<sentry-user-auth-token>
apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: sentry
  namespace: mcp-server
spec:
  contextRef: context1
  description: >-
    Sentry remote MCP (official) - error/issue search, triage and debugging
    tools for coding agents. Sentry-Bearer token auth.
  enabled: true
  managed: true
  image: us-central1-docker.pkg.dev/eventfire-491421/clerum/nginx-egress-proxy:sha-094c86f
  remote:
    baseUrl: https://mcp.sentry.dev/mcp
    authHeaders:
      - header: Authorization
        valueTemplate: Sentry-Bearer ${SENTRY_ACCESS_TOKEN}
  envSecret:
    name: sentry-credentials
    keys:
      - secretKey: SENTRY_ACCESS_TOKEN
        envVar: SENTRY_ACCESS_TOKEN
  egressBindings:
    - dns: mcp.sentry.dev
      egressClass: exact-host
      port: 443
      protocol: TCP
  transport:
    type: streamableHttp
    url: http://sentry.mcp-server.svc.cluster.local:3000/mcp
    port: 3000