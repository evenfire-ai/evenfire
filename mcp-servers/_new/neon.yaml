# Neon MCP — remote wrapper (Category A)
# Official remote: https://mcp.neon.tech/mcp (Streamable HTTP)
# Docs: https://neon.com/docs/ai/neon-mcp-server
# Auth (headless): Authorization: Bearer <NEON_API_KEY>
# Scope via URL params: ?readonly=true, ?projectId=, ?category=
#   kubectl --context=dev create secret generic neon-credentials \
#     -n mcp-server --from-literal=NEON_API_KEY=<api-key>
apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: neon
  namespace: mcp-server
spec:
  contextRef: context1
  description: Neon remote MCP (official) - serverless Postgres projects, branches, queries. Bearer API key auth.
  enabled: true
  managed: true
  image: us-central1-docker.pkg.dev/eventfire-491421/clerum/nginx-egress-proxy:sha-094c86f
  remote:
    baseUrl: https://mcp.neon.tech/mcp
    authHeaders:
      - header: Authorization
        valueTemplate: Bearer ${NEON_API_KEY}
  envSecret:
    name: neon-credentials
    keys:
      - secretKey: NEON_API_KEY
        envVar: NEON_API_KEY
  egressBindings:
    - dns: mcp.neon.tech
      egressClass: exact-host
      port: 443
      protocol: TCP
  transport:
    type: streamableHttp
    url: http://neon.mcp-server.svc.cluster.local:3000/mcp
    port: 3000