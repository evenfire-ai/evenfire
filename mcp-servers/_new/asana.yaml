# Asana MCP — remote MCP wrapper (Category A)
#
# Official remote MCP: https://mcp.asana.com/v2/mcp (Streamable HTTP)
# Docs: https://developers.asana.com/docs/using-asanas-mcp-server
# (v1 beta at mcp.asana.com/sse is deprecated and shuts down 05/11/2026.)
#
# Auth: Asana documents OAuth for the V2 server. Bearer-token (PAT) passthrough
# is configured here following the same pattern as other vendors — VERIFY during
# smoke testing whether PAT is accepted or an OAuth-issued token is required.
#
# Secret must exist BEFORE the MCP handshake works:
#   kubectl --context=dev create secret generic asana-credentials \
#     -n mcp-server --from-literal=ASANA_ACCESS_TOKEN=<asana-token>
apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: asana
  namespace: mcp-server
spec:
  contextRef: context1
  description: >-
    Asana remote MCP (official, V2) - Asana Work Graph: tasks, projects,
    sections, portfolios and status reporting. Bearer token auth.
  enabled: true
  managed: true
  image: us-central1-docker.pkg.dev/eventfire-491421/clerum/nginx-egress-proxy:sha-094c86f
  remote:
    baseUrl: https://mcp.asana.com/v2/mcp
    authHeaders:
      - header: Authorization
        valueTemplate: Bearer ${ASANA_ACCESS_TOKEN}
  envSecret:
    name: asana-credentials
    keys:
      - secretKey: ASANA_ACCESS_TOKEN
        envVar: ASANA_ACCESS_TOKEN
  egressBindings:
    - dns: mcp.asana.com
      egressClass: exact-host
      port: 443
      protocol: TCP
  transport:
    type: streamableHttp
    url: http://asana.mcp-server.svc.cluster.local:3000/mcp
    port: 3000