# CircleCI MCP — remote wrapper (Category A)
# Official remote: https://mcp.circleci.com/v1/mcp (Streamable HTTP)
# Docs: https://circleci.com/product/mcp/
# Auth (headless): Authorization: Bearer <circleci-personal-api-token>
#   kubectl --context=dev create secret generic circleci-credentials \
#     -n mcp-server --from-literal=CIRCLECI_TOKEN=<personal-api-token>
apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: circleci
  namespace: mcp-server
spec:
  contextRef: context1
  description: CircleCI remote MCP (official) - pipelines, jobs, insights. Bearer token auth.
  enabled: true
  managed: true
  image: us-central1-docker.pkg.dev/eventfire-491421/clerum/nginx-egress-proxy:sha-094c86f
  remote:
    baseUrl: https://mcp.circleci.com/v1/mcp
    authHeaders:
      - header: Authorization
        valueTemplate: Bearer ${CIRCLECI_TOKEN}
  envSecret:
    name: circleci-credentials
    keys:
      - secretKey: CIRCLECI_TOKEN
        envVar: CIRCLECI_TOKEN
  egressBindings:
    - dns: mcp.circleci.com
      egressClass: exact-host
      port: 443
      protocol: TCP
  transport:
    type: streamableHttp
    url: http://circleci.mcp-server.svc.cluster.local:3000/mcp
    port: 3000