# Template-only policy. The `except: []` placeholder below must be rendered by
# `make deploy-playwright`; do not apply this file directly with `kubectl apply -f`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playwright-server-custom-traffic
  namespace: mcp-server
spec:
  podSelector:
    matchLabels:
      clerum.io/mcpserver: playwright-server
  policyTypes:
    - Egress
  egress:
    # Scope is rule-level public web egress only. In normal deployments DNS is
    # supplied by the namespace base policy; internal targets need explicit policy.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
