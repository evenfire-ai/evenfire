apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: playwright-server
  namespace: mcp-server
spec:
  description: >-
    Playwright MCP Server - browser automation tools for navigation, DOM interaction,
    code execution, and screenshot capture.
  image: ghcr.io/evenfire-ai/playwright-server@sha256:fc603bbc05d216ca9394940463e5e216d0a48732c24555fb9b67d20775fccf73
  imagePullPolicy: Always
  command:
    - node
  args:
    - cli.js
    - --headless
    - --browser
    - chromium
    - --no-sandbox
    - --host
    - 0.0.0.0
    - --port
    - '8931'
    - --allowed-hosts
    - '*'
  transport:
    type: streamableHttp
    url: http://playwright-server.mcp-server.svc.cluster.local:8931/mcp
    port: 8931
  auth:
    type: none
  resources:
    requests:
      memory: '512Mi'
      cpu: '250m'
    limits:
      memory: '1Gi'
      cpu: '1000m'
  enabled: true
