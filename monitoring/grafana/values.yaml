replicas: 1

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClassName: do-block-storage
  accessModes: ["ReadWriteOnce"]
  size: 10Gi

adminUser: admin
# adminPassword: <set-via-secret-or-override>

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        # Stable uid: dashboards/loki-grafana-dashboard.json references this
        # datasource by uid. Change both together.
        uid: P8E80F9AEF21F6940
        access: proxy
        url: http://loki.monitoring:3100
        isDefault: false
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: grafana-dashboards

securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
