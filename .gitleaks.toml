# gitleaks configuration for evenfire.
#
# Extends the upstream default ruleset, then allowlists the handful of files
# that are *supposed* to contain credential-shaped strings: committed example
# env files and test fixtures. Those values are deliberately invalid
# placeholders (see .env.test), but scanners still pattern-match on prefixes,
# so a fresh clone would otherwise report false positives.
#
# This narrows noise only. Real secrets in real source files are still caught.

title = "evenfire"

[extend]
useDefault = true

[allowlist]
description = "Committed placeholder credentials and test fixtures"

paths = [
  # Example/placeholder env files — force-committed on purpose (see .gitignore).
  '''^\.env\.test$''',
  '''^\.env\..*\.example$''',
  '''^\.env\.example$''',
  # Test + fixture surface — fake credentials by design (unit tests, e2e
  # helpers, example manifests). Verified 2026-07-24: every flagged value here
  # is a deliberately-fake fixture key.
  '''\.test\.(ts|tsx|js|jsx|mjs|cjs)$''',
  '''(^|/)__tests__/''',
  '''(^|/)tests?/''',
  '''(^|/)e2e/''',
  '''(^|/)fixtures?/''',
  '''(^|/)examples?/''',
  # Documented CLERUM_DEV_MODE fallback JWT keys (DEV_*_JWT_PRIVATE_KEY) and the
  # production boot-guard that fingerprints them to REFUSE dev keys in prod.
  # Throwaway keys, not real secrets. See the file for the guard.
  '''^control-api/src/config\.ts$''',
  # `export const deriveOAuthEncryptionKey = deriveAes256GcmKey` — a function
  # alias the generic-api-key entropy heuristic mis-reads as a secret.
  '''^control-api/src/oauth/encryption\.ts$''',
]

regexes = [
  # Our placeholder convention: any value carrying REPLACE-ME is never a secret.
  '''REPLACE-ME''',
  # Angle-bracket doc placeholders, e.g. <TELEGRAM_BOT_TOKEN>.
  '''<[A-Z0-9_]+>''',
]
