apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: webhook-hello
  namespace: sandbox-recipes
spec:
  description: >-
    Smallest possible recipe with spec.webhooks[]. Used by
    scripts/e2e/e2e-webhooks-basic.sh to gate the webhook stack on a
    real cluster. The handler is nginxinc/nginx-unprivileged with a
    minimal endpoint that accepts POST and returns 200, proving the
    verify+forward pipeline. Headers sent by the gateway show up in
    the nginx access log.
  workloads:
    - id: handler
      type: deployment
      image: nginxinc/nginx-unprivileged:1.27-alpine
      port: 8080
      command: ['/bin/sh', '-c']
      args:
        - |
          set -e
          cat > /tmp/nginx.conf <<'EOF'
          worker_processes 1;
          pid /tmp/nginx.pid;
          error_log /dev/stderr;
          events {}
          http {
            access_log /dev/stdout;
            server {
              listen 8080;
              location / {
                default_type text/plain;
                return 200 'webhook-ok\n';
              }
            }
          }
          EOF
          exec nginx -c /tmp/nginx.conf -g 'daemon off;'
  webhooks:
    - id: hello
      workloadRef: handler
      path: /
      verification:
        scheme: hmac-sha256-body
        secretRef:
          name: webhook-hello-creds
          key: signing-secret
        signatureHeader: X-Hub-Signature-256
        signaturePrefix: 'sha256='
        signatureEncoding: hex
