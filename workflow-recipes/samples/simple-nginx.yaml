apiVersion: clerum.io/v1alpha1
kind: WorkflowRecipe
metadata:
  name: simple-nginx
  namespace: sandbox-recipes
spec:
  description: 'Simple Nginx deployment for E2E testing'
  workloads:
    - id: nginx
      type: deployment
      image: nginx:1.30.1-alpine
      port: 80
      replicas: 1
      resources:
        requests:
          cpu: '50m'
          memory: '64Mi'
        limits:
          cpu: '100m'
          memory: '128Mi'
  security:
    isolationLevel: minimal
