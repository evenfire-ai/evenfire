name: Release Desktop update builds

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'evenfire-ai/evenfire'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            flag: --mac
          - platform: windows
            runner: windows-latest
            flag: --win
          - platform: linux
            runner: ubuntu-24.04
            flag: --linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Verify release version and backend compatibility declaration
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const pkg = require("./desktop-app/package.json"); if (process.env.RELEASE_TAG !== `v${pkg.version}`) { throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match Desktop ${pkg.version}`) }'
          node scripts/release/update-desktop-release-manifest.mjs --validate-only

      - name: Install Desktop dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Verify Electron runtime
        working-directory: desktop-app
        run: npm run verify:electron

      - name: Build Desktop application
        working-directory: desktop-app
        run: npm run build

      - name: Require Windows signing credentials
        if: matrix.platform == 'windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WIN_CSC_LINK" || { echo "DESKTOP_WINDOWS_CSC_LINK is required for updater releases." >&2; exit 1; }
          test -n "$WIN_CSC_KEY_PASSWORD" || { echo "DESKTOP_WINDOWS_CSC_KEY_PASSWORD is required for updater releases." >&2; exit 1; }

      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.DESKTOP_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK" || { echo "DESKTOP_MACOS_CSC_LINK is required for updater releases." >&2; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "DESKTOP_MACOS_CSC_KEY_PASSWORD is required for updater releases." >&2; exit 1; }
          test -n "$APPLE_API_KEY_P8" || { echo "DESKTOP_APPLE_API_KEY_P8 is required for notarization." >&2; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo "DESKTOP_APPLE_API_KEY_ID is required for notarization." >&2; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "DESKTOP_APPLE_API_ISSUER is required for notarization." >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Build updater packages and metadata
        working-directory: desktop-app
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MACOS_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.DESKTOP_WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.flag }} --x64 --arm64 --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-update-${{ matrix.platform }}
          path: desktop-app/out-updater/*
          if-no-files-found: error
          retention-days: 2

  publish:
    if: github.repository == 'evenfire-ai/evenfire'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-update-*
          path: desktop-update-assets
          merge-multiple: true

      - name: Publish updater assets to the exact release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          files=(desktop-update-assets/*)
          test -e "${files[0]}" || { echo "No Desktop updater assets were built." >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
