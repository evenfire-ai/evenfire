name: Exact CI provenance

on:
  workflow_call:
    inputs:
      head_sha:
        description: 'Exact source commit whose push CI must have succeeded'
        required: true
        type: string
      allowed_branches:
        description: 'Comma-separated push branches accepted for the exact SHA'
        required: true
        type: string

jobs:
  validate-inputs:
    name: Validate provenance inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an exact commit and branch boundary
        env:
          ALLOWED_BRANCHES: ${{ inputs.allowed_branches }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$HEAD_SHA" = "$zero" ]; then
            echo "::error::A non-zero full head SHA is required for exact CI provenance."
            exit 1
          fi
          if [ -z "$ALLOWED_BRANCHES" ]; then
            echo "::error::An explicit allowed_branches value is required."
            exit 1
          fi

  provenance:
    name: CI provenance (exact SHA)
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Require successful CI push run for exact SHA
        env:
          ALLOWED_BRANCHES: ${{ inputs.allowed_branches }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.head_sha }}
        run: >-
          node scripts/ci/require-successful-ci-run.mjs
          --sha "$SOURCE_SHA"
          --branches "$ALLOWED_BRANCHES"

  conclude:
    name: Exact CI provenance result
    if: always()
    needs: [validate-inputs, provenance]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require exact CI provenance to pass
        env:
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          VALIDATE_RESULT: ${{ needs.validate-inputs.result }}
        run: |
          set -euo pipefail
          [ "$VALIDATE_RESULT" = success ] && [ "$PROVENANCE_RESULT" = success ]
