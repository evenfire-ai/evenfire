name: ARM runner probe
# TEMPORARY. Proves ubuntu-24.04-arm is available to this repo before
# build-publish.yml is restructured to depend on it. Deleted in the same task.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Report the machine
        run: |
          echo "uname -m: $(uname -m)"
          echo "nproc:    $(nproc)"
          test "$(uname -m)" = "aarch64" || { echo "::error::not aarch64"; exit 1; }
