name: PR 977 exact-source Windows diagnostics

on:
  push:
    branches:
      - test/pr977-windows-1d0a05af-20261028-r24m2

permissions:
  contents: read

concurrency:
  group: pr977-windows-exact-source-1d0a05af-r24m2
  cancel-in-progress: false

jobs:
  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      PR977_SOURCE_SHA: 1d0a05af39e03ca6bce6e137c738cb270e3a9115

    steps:
      - name: Check out the exact PR correction source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PR977_SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the temporary validation harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and report the source and trigger commits
        shell: pwsh
        run: |
          $triggerSha = $env:GITHUB_SHA
          $sourceSha = (git -C source rev-parse HEAD).Trim()
          $harnessSha = (git -C validation rev-parse HEAD).Trim()
          $nvmrc = (Get-Content source/.nvmrc -Raw).Trim()
          Write-Output "Workflow trigger SHA: $triggerSha"
          Write-Output "Validation harness SHA: $harnessSha"
          Write-Output "Windows-tested application source SHA: $sourceSha"
          Write-Output "Repository-pinned Node version: $nvmrc"
          if ($triggerSha -ne $harnessSha) { throw 'Harness checkout does not match workflow trigger SHA' }
          if ($sourceSha -ne $env:PR977_SOURCE_SHA) { throw 'Application source SHA mismatch' }
          if ($nvmrc -ne '24.22.1') { throw 'Repository Node pin is not 24.22.1' }

      - name: Set up repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            source/desktop-app/package-lock.json
            source/mcp-host/package-lock.json

      - name: Record hosted Windows runtime
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion ($env:RUNNER_ARCH)"
          Write-Output "Windows: $($os.Caption) $($os.Version)"
          Write-Output "Node: $(node --version)"
          Write-Output "npm: $(npm --version)"
          if ((node --version) -ne 'v24.22.1') { throw 'Unexpected Node runtime' }

      - name: Overlay validation-only native test files
        shell: pwsh
        run: |
          $sourceSha = (git -C source rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:PR977_SOURCE_SHA) { throw 'Application source changed before test overlay' }
          $names = @(
            'windowsSessionAuthorityAcl.native.test.ts',
            'windowsSessionAuthorityDurableFileOps.native.test.ts'
          )
          $committedLauncherTests = @(
            'windowsSessionAuthorityAcl.launch.test.ts',
            'windowsSessionAuthorityFileOps.launch.test.ts'
          )
          foreach ($name in $committedLauncherTests) {
            $sourceTest = Join-Path 'source/desktop-app/src/__tests__' $name
            if (-not (Test-Path $sourceTest)) { throw "Missing committed launcher test: $name" }
          }
          $targetDirectory = 'source/desktop-app/src/__tests__'
          foreach ($name in $names) {
            $target = Join-Path $targetDirectory $name
            if (Test-Path $target) { throw "Refusing to replace source test: $name" }
            $inputFile = Join-Path 'validation/.validation/windows' $name
            if (-not (Test-Path $inputFile)) { throw "Missing validation test: $name" }
            Copy-Item -LiteralPath $inputFile -Destination $target
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $inputFile).Hash.ToLowerInvariant()
            Write-Output "Validation-only test overlay: $name SHA256=$hash"
          }
          if ((git -C source rev-parse HEAD).Trim() -ne $env:PR977_SOURCE_SHA) {
            throw 'Application source SHA changed during test overlay'
          }

      - name: Install Host fixture dependencies
        working-directory: source/mcp-host
        run: npm ci

      - name: Install Desktop dependencies
        working-directory: source/desktop-app
        run: npm ci

      - name: Run focused exact-source Windows diagnostics
        id: diagnostics
        continue-on-error: true
        working-directory: source/desktop-app
        shell: pwsh
        env:
          EVENFIRE_REQUIRE_WINDOWS_ACL_TEST: '1'
          EVENFIRE_REQUIRE_WINDOWS_DURABLE_TEST: '1'
        run: |
          $cases = @(
            @{ name = 'authority-directory-provision-and-verify'; file = 'src/__tests__/windowsSessionAuthorityAcl.native.test.ts'; pattern = 'provisions a protected authority directory and verifies every existing child' },
            @{ name = 'system-owned-child-fixture'; file = 'src/__tests__/windowsSessionAuthorityAcl.native.test.ts'; pattern = 'accepts a child owned by the allowlisted SYSTEM principal with current-user access intact' },
            @{ name = 'logout-keytar-representative'; file = 'src/__tests__/appService.pendingExternalLogoutKeytarUnavailable.test.ts'; pattern = 'keeps a durably signed-out V1 session denied when exact cleanup fails' },
            @{ name = 'persistence-mutation-representative'; file = 'src/__tests__/appService.persistenceMutation.contract.test.ts'; pattern = 'keeps exact logout cleanup from deleting a fresh source accepted during prior-source cleanup' },
            @{ name = 'password-rollback-representative'; file = 'src/__tests__/appService.passwordLoginRollback.regression.test.ts'; pattern = 'restores the accepted prior source when candidate preparation fails after publication' },
            @{ name = 'simulated-linux-basic-text-case'; file = 'src/__tests__/appService.pendingExternalLogoutKeytarUnavailable.test.ts'; pattern = 'uses memory-only mode when Linux safeStorage selects the basic_text backend' }
          )
          $results = @()
          foreach ($case in $cases) {
            Write-Output "Running focused diagnostic: $($case.name)"
            $json = Join-Path $env:RUNNER_TEMP ("pr977-windows-diagnostic-{0}.json" -f $case.name)
            $arguments = @(
              'test', '--', '--testTimeout=120000', '--hookTimeout=120000',
              '--reporter=verbose', '--reporter=json', "--outputFile.json=$json",
              "--testNamePattern=$($case.pattern)", $case.file
            )
            & npm @arguments
            $code = $LASTEXITCODE
            $results += [ordered]@{ name = $case.name; exitCode = $code; reportWritten = (Test-Path $json) }
            Write-Output "Diagnostic result: $($case.name) exit=$code report=$((Test-Path $json))"
          }
          $results | ConvertTo-Json -Depth 4
          if (@($results | Where-Object { $_.exitCode -ne 0 }).Count -gt 0) {
            throw 'One or more focused Windows diagnostics failed; inspect the per-test evidence above.'
          }
