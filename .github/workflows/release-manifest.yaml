name: Release Manifest

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-manifest.yaml'
      - 'scripts/release/update-desktop-release-manifest.mjs'
      - 'scripts/release/validate-release-version-bumps.mjs'
      - 'external-rest-api/src/**'
      - 'external-rest-api/test/**'
      - 'external-rest-api/tsconfig.json'
      - 'external-rest-api/package.json'
      - 'external-rest-api/src/releaseManifest.ts'
      - 'rpc-proxy/src/**'
      - 'rpc-proxy/test/**'
      - 'rpc-proxy/tsconfig.json'
      - 'rpc-proxy/package.json'
      - 'desktop-app/src/**'
      - 'desktop-app/ui/src/**'
      - 'desktop-app/test/**'
      - 'desktop-app/forge.config.js'
      - 'desktop-app/tsconfig.json'
      - 'desktop-app/vitest.config.ts'
      - 'desktop-app/ui/vite.config.ts'
      - 'desktop-app/package.json'

permissions:
  contents: write

concurrency:
  group: release-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update release manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.BOT_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate package version bumps
        run: |
          node scripts/release/validate-release-version-bumps.mjs \
            --previous "${{ github.event.before }}"

      - name: Generate release manifest
        run: |
          node scripts/release/update-desktop-release-manifest.mjs \
            --previous "${{ github.event.before }}" \
            --release-id "master-${GITHUB_SHA::7}"

      - name: Validate release manifest
        run: node scripts/release/update-desktop-release-manifest.mjs --validate-only

      - name: Commit release manifest
        run: |
          if git diff --quiet -- external-rest-api/src/releaseManifest.ts; then
            echo "Release manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add external-rest-api/src/releaseManifest.ts
          git commit -m "chore(release): update desktop release manifest [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
