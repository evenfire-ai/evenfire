name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  repo-hygiene:
    name: Repo hygiene (no internal working artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No superpowers docs may be tracked
        # docs/superpowers/ holds per-developer working artifacts (brainstorm
        # specs, implementation plans) that are gitignored by convention. The
        # gitignore cannot stop a `git add -f`, so this gate can: any tracked
        # file under a superpowers directory fails CI. If you hit this, the
        # file belongs in the brain or your local tree, not the distribution.
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(docs/(archive/)?superpowers|superpowers)/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked superpowers working artifacts found:"
            echo "$tracked"
            exit 1
          fi
      - name: Shipped shell scripts must be executable
        # The sync-to-OSS pipeline has stripped exec bits before (every .sh at
        # mode 100644), which breaks `make minikube-setup` with Permission
        # denied on a fresh clone. Regression gate for the PR #93 fix.
        run: |
          bad=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-executable shell scripts (mode must be 100755):"
            echo "$bad"
            exit 1
          fi

  test:
    name: Build / test / typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every service with a `test` script belongs here. Keep in sync with
        # TEST_SERVICES in the root Makefile — a service in one but not the other
        # means its tests run in only half the places contributors look.
        service:
          - mcp-host
          - channel-reader
          - host-context-controller
          - control-api
          - mcp-proxy
          - workflow-recipes
          - gfs-controller
          - workspace-files-controller
          - rpc-proxy
          - webhook-gateway
          - webhook-proxy
          - workflow-approval-request-reader
          - stdio-bridge
          - external-rest-api
          - profile-ui
          - desktop-app
          - mcp-servers
          - packages/desktop-app-links
          - packages/workflow-runtime-core
          - packages/workflow-sdk
          - packages/network-policy-core
          - packages/llm-provider-attempt-contract
          - codex-llm-proxy

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      # workflow-recipes, control-api and packages/workflow-sdk all consume
      # @clerum/workflow-runtime-core via a `file:../packages/workflow-runtime-core`
      # dependency. Build that package first so its dist/ exists before the service's
      # `npm ci` links it in — otherwise the build fails with TS2307
      # "Cannot find module '@clerum/workflow-runtime-core'".
      - name: Install workflow-runtime-core dependencies
        if: matrix.service == 'workflow-recipes' || matrix.service == 'control-api' || matrix.service == 'packages/workflow-sdk'
        working-directory: packages/workflow-runtime-core
        run: npm ci

      - name: Build workflow-runtime-core
        if: matrix.service == 'workflow-recipes' || matrix.service == 'control-api' || matrix.service == 'packages/workflow-sdk'
        working-directory: packages/workflow-runtime-core
        run: npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Verify Electron runtime
        if: matrix.service == 'desktop-app'
        working-directory: desktop-app
        run: npm run verify:electron

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Install Playwright Chromium
        if: matrix.service == 'desktop-app'
        working-directory: desktop-app
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test

      # Typecheck against the base tsconfig (covers src + test dirs).
      # This catches errors in test files that tsconfig.build.json may exclude.
      #
      # mcp-servers is skipped: it has no root tsconfig.json (only the web-search and
      # doc-generator sub-projects have one), so `tsc --noEmit` there resolves no
      # project and just prints its help text. Adding a strict root tsconfig surfaces
      # ~10 pre-existing type errors in its __tests__ — worth fixing, but as its own
      # change rather than smuggled into a CI-coverage PR.
      # network-policy-core is a hand-authored .cjs + .d.ts with no tsconfig, so
      # `tsc --noEmit` resolves no project (like mcp-servers). Its .d.ts is kept
      # aligned with the runtime by the "runtime exports stay aligned" node:test.
      # llm-provider-attempt-contract is the same shape: hand-authored .cjs + .d.ts,
      # no tsconfig; node --test keeps the types aligned with the runtime.
      - name: Typecheck (tsc --noEmit)
        if: matrix.service != 'mcp-servers' && matrix.service != 'packages/desktop-app-links' && matrix.service != 'packages/network-policy-core' && matrix.service != 'packages/llm-provider-attempt-contract'
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit

  # ─── real-Postgres integration suites ─────────────────────────────────────
  # Runs EVERY *.realPostgres.integration suite against a real Postgres 16: the
  # DB migration plus the GFS reader-role / blob-migration / blob-reconciler /
  # audit-evidence / copy / readiness / structural-integrity suites in
  # control-api, and the rename-publication concurrency suite in gfs-controller.
  # All of them are gated on CONTROL_API_REAL_PG_ADMIN_URL and SKIP when it is
  # unset, so the matrix `npm test` never exercises them — this job is the only
  # place they actually run. Catches the exact class of failure (a config/env or
  # role/credential gap surfacing at migration or query time) that otherwise
  # only appears at deploy. Runs unconditionally in the public repo (no
  # paths-filter): correctness over CI minutes on a low-volume repo.
  control-api-migration:
    name: Real Postgres integration (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['15433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control-api/package-lock.json

      - name: Install dependencies
        working-directory: control-api
        run: npm ci

      - name: Install workflow-runtime-core dependencies
        working-directory: packages/workflow-runtime-core
        run: npm ci

      - name: Build workflow-runtime-core
        working-directory: packages/workflow-runtime-core
        run: npm run build

      - name: Run control-api real Postgres suites (migration + GFS)
        working-directory: control-api
        env:
          CONTROL_API_REAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:15433/postgres
          CONTROL_API_REAL_PG_REQUIRED: '1'
          FORCE_COLOR: '0'
          NO_COLOR: '1'
        # The `realPostgres` filter matches every control-api
        # *.realPostgres.integration suite. The ordinary matrix may omit these
        # suites when no admin DSN is supplied; this job requires the DSN and
        # therefore fails before test collection if the lane is misconfigured.
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          normalized_log="$(mktemp)"
          trap 'rm -f "$log_file" "$normalized_log"' EXIT
          test -n "${CONTROL_API_REAL_PG_ADMIN_URL}"
          FORCE_COLOR=0 NO_COLOR=1 npm test -- --run realPostgres 2>&1 | tee "$log_file"
          sed $'s/\033\\[[0-9;]*m//g' "$log_file" > "$normalized_log"
          grep -Eq 'Test Files[[:space:]]+[1-9][0-9]* passed' "$normalized_log" || {
            echo 'real-Postgres control-api lane executed zero passing test files' >&2
            exit 1
          }
          grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed' "$normalized_log" || {
            echo 'real-Postgres control-api lane executed zero passing tests' >&2
            exit 1
          }
          if grep -Eq '(Test Files|Tests).*([1-9][0-9]*) skipped' "$normalized_log"; then
            echo 'real-Postgres control-api lane reported skipped tests' >&2
            exit 1
          fi
          # Codex subscription suites must stay inside the real-Postgres filter.
          # A rename or move that drops them from `*realPostgres*` would otherwise
          # still pass the aggregate counts above.
          for suite in \
            db.codexSubscriptionConnection.realPostgres.integration \
            services.codexSubscriptionOAuth.realPostgres.integration \
            services.codexSubscriptionCatalog.realPostgres.integration \
            services.llmProviderAttemptAuthorization.realPostgres.integration \
            services.llmProviderAttemptStore.realPostgres.integration \
            services.llmProviderAttemptRedemption.realPostgres.integration \
            services.llmProviderAttemptFinalization.realPostgres.integration
          do
            grep -Fq "$suite" "$normalized_log" || {
              echo "real-Postgres control-api lane omitted Codex suite ${suite}" >&2
              exit 1
            }
          done

      - name: Install gfs-controller dependencies
        working-directory: gfs-controller
        run: npm ci

      - name: Run gfs-controller real Postgres suites
        working-directory: gfs-controller
        env:
          CONTROL_API_REAL_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:15433/postgres
          CONTROL_API_REAL_PG_REQUIRED: '1'
          FORCE_COLOR: '0'
          NO_COLOR: '1'
        # rename-publication concurrency suite — also admin-URL-gated, so the
        # gfs-controller matrix entry skips it.
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          normalized_log="$(mktemp)"
          trap 'rm -f "$log_file" "$normalized_log"' EXIT
          test -n "${CONTROL_API_REAL_PG_ADMIN_URL}"
          FORCE_COLOR=0 NO_COLOR=1 npm test -- --run realPostgres 2>&1 | tee "$log_file"
          sed $'s/\033\\[[0-9;]*m//g' "$log_file" > "$normalized_log"
          grep -Eq 'Test Files[[:space:]]+[1-9][0-9]* passed' "$normalized_log" || {
            echo 'real-Postgres gfs-controller lane executed zero passing test files' >&2
            exit 1
          }
          grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed' "$normalized_log" || {
            echo 'real-Postgres gfs-controller lane executed zero passing tests' >&2
            exit 1
          }
          if grep -Eq '(Test Files|Tests).*([1-9][0-9]*) skipped' "$normalized_log"; then
            echo 'real-Postgres gfs-controller lane reported skipped tests' >&2
            exit 1
          fi

  # ─── control-ui build + test check ───────────────────────────────────────
  # control-ui stays out of the SHARED build/test matrix because its tsconfig
  # spans test files and a bare `tsc --noEmit` there hits a pre-existing error in
  # a *.test.tsx that `next build` does not typecheck. But its vitest suite IS
  # green, so it runs here as a dedicated step — otherwise the GFS proxy body-cap,
  # Expect-strip and timeout-knob tests this repo relies on would guard nothing in
  # CI. A production `next build` still runs the app TypeScript typecheck + ESLint.
  control-ui-build:
    name: Build (control-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control-ui/package-lock.json
      - name: Install dependencies
        working-directory: control-ui
        run: npm ci
      - name: Test (vitest)
        working-directory: control-ui
        run: npm test
      - name: Build (next build — typecheck + lint + compile)
        working-directory: control-ui
        run: npm run build

  # ─── Registry contract — boot evenfire-registry and drive the real client ──
  # Catches wire-format drift in clerumRegistryClient.ts before merge. Requires
  # CROSS_REPO_READ_TOKEN (a fine-grained PAT with Contents:read on the sibling
  # registry repo). When the secret is absent — every fork PR, and any repo
  # where ops has not provisioned it — the job short-circuits with a warning
  # instead of failing, exactly like the monorepo gate.
  registry-contract:
    name: Registry contract (consumer → registry)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry
        ports: ['15432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check cross-repo token availability
        id: token_check
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_READ_TOKEN" ]; then
            echo "::warning::CROSS_REPO_READ_TOKEN not set — skipping registry-contract job. Provision the secret in repo Settings → Secrets to enable cross-repo contract tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout evenfire-registry
        if: steps.token_check.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: keyper-labs/evenfire-registry
          path: evenfire-registry
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token_check.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            workflow-recipes/package-lock.json
            evenfire-registry/package-lock.json

      - name: Boot evenfire-registry
        if: steps.token_check.outputs.skip != 'true'
        working-directory: evenfire-registry
        # NOTE: registry reads CLERUM_REGISTRY_PORT (not PORT). Without this
        # the server binds to its 8085 default and the readiness poll on 18085
        # times out.
        run: |
          npm ci
          npm run build
          CLERUM_REGISTRY_PORT=18085 \
          CLERUM_REGISTRY_DB_URL=postgres://postgres:postgres@127.0.0.1:15432/registry \
          CLERUM_REGISTRY_AUTH_ENABLED=false \
          node dist/main.js &
          echo $! > /tmp/registry.pid
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18085/health >/dev/null 2>&1; then
              echo "Registry ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18085/health || (echo "Registry never became ready" && exit 1)

      - name: Run consumer integration tests against the booted registry
        if: steps.token_check.outputs.skip != 'true'
        working-directory: workflow-recipes
        env:
          TEST_REGISTRY_URL: http://127.0.0.1:18085
        run: |
          npm ci
          npm test -- --run test/integration/clerumRegistryClient.test.ts

      - name: Stop registry
        if: always() && steps.token_check.outputs.skip != 'true'
        run: |
          if [ -f /tmp/registry.pid ]; then
            kill "$(cat /tmp/registry.pid)" 2>/dev/null || true
          fi

  # ─── Bash syntax + shell test gates ───────────────────────────────────────
  # `bash -n` is a parse-only check; catches dangling braces / bad substitutions
  # that would break `make minikube-*` at runtime. The named script tests assert
  # generated-manifest and gate-orchestration contracts.
  shell-syntax:
    name: Shell script syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run bash -n on all .sh files
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f" 2>err_out; then
              echo "::error file=$f::bash syntax error"
              cat err_out
              fail=1
            fi
          done < <(find deploy/scripts scripts -type f -name '*.sh' 2>/dev/null)
          exit $fail

      - name: Validate governed tracing operations gate orchestration
        run: bash scripts/tests/test-governed-tracing-operations-gate.sh

      - name: Test HCC watch-recovery gate coordination
        run: bash scripts/tests/test-hcc-watch-recovery-gate.sh

      - name: Test HCC watch-churn readiness gate contract
        run: bash scripts/tests/test-hcc-watch-churn-readiness-gate.sh

      - name: Test HCC API gateway readiness separation
        run: bash scripts/tests/test-hcc-api-gateway-readiness.sh

      - name: Test host-storm metric adjudication
        run: bash scripts/tests/test-host-storm-metric-gate.sh

      - name: Test WRC-to-HCC contracts
        run: bash scripts/tests/test-wrc-hcc-contracts-gate.sh

      - name: Test WRC internal dependency NetworkPolicy contracts
        run: bash scripts/tests/test-wrc-internal-dependency-networkpolicy-gate.sh

      - name: Test minikube sandbox-ui NetworkPolicy lint (static-policy ownership + DNS)
        run: bash scripts/tests/test-lint-networkpolicies.sh

      - name: Test Plugin Workload SDK auth bootstrap policy
        run: bash scripts/tests/test-plugin-workload-sdk-auth-bootstrap.sh

      - name: Test GFS grant WorkflowRecipe seed rendering
        run: bash scripts/tests/test-seed-gfs-grant-workflow.sh

      - name: Test minikube detect-k8s-api-ip template rendering
        run: bash scripts/tests/test-minikube-detect-k8s-api-ip.sh

      - name: Validate single-writer rollout invariant on rendered overlays
        run: |
          # The k8s-api-ip patch is rendered from a gitignored template at setup
          # time; render it with a dummy IP so `kubectl kustomize` can build the
          # minikube overlay here. The gcp-* overlays live in evenfire-infra, so
          # this repo validates only the minikube overlay it actually ships.
          sed 's#__K8S_API_IP__#10.96.0.1#g' \
            deploy/overlays/minikube/patches/k8s-api-ip.yaml.template \
            > deploy/overlays/minikube/patches/k8s-api-ip.yaml
          SINGLE_WRITER_OVERLAYS="deploy/overlays/minikube" \
            bash deploy/scripts/validate-postgres-single-writer-strategy.sh

      - name: Test single-writer validator fails loud on an absent local deploy
        run: bash scripts/tests/test-postgres-single-writer-strategy.sh

      - name: Test post-reset convergence isolates DB-dependent controllers
        run: bash scripts/tests/test-converge-control-db-after-reset.sh

      - name: Test release coordinates (writer, checker, floor decoupling)
        run: bash scripts/tests/test-release-coordinates.sh

      - name: Test precommit release-manifest exemption
        run: bash scripts/tests/test-precommit-release-manifest-ignore.sh

      - name: Validate release manifest matches package versions
        run: node scripts/release/update-desktop-release-manifest.mjs --validate-only

      - name: Validate service version bumps
        run: node scripts/release/validate-release-version-bumps.mjs --previous "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Test the image manifest
        run: bash scripts/tests/test-images-manifest.sh

      - name: Test the ghcr-images kustomize component
        run: bash scripts/tests/test-ghcr-component.sh

      - name: Test the ghcr render guard
        run: bash scripts/tests/test-ghcr-render-guard.sh

      - name: Test Docker local-package COPY and materialization contract
        run: bash scripts/tests/test-dockerfile-local-packages.sh

      - name: Test the minikube image puller
        run: bash scripts/tests/test-minikube-pull-images.sh

      - name: Test the minikube image verifier (recorded mode, E2E fixtures)
        run: bash scripts/tests/test-minikube-verify-images.sh

      # The ghcr path calls build-images.sh as --public-only, which builds
      # nothing. This proves it no longer narrates builds it never performs,
      # and that the local build path still announces every phase.
      - name: Test the build-images section banners
        run: bash scripts/tests/test-minikube-build-section-headers.sh

      - name: Test minikube Makefile targets
        run: bash scripts/tests/test-minikube-makefile.sh

      - name: Test minikube GFS Upload v2 profile contract
        run: bash scripts/tests/test-minikube-gfs-upload-v2-profile.sh

      - name: Test GFS Upload v2 cross-client geometry contract
        run: bash scripts/tests/test-gfs-upload-v2-geometry-contract.sh

      - name: Test GFS real-Postgres Minikube runner contract
        run: bash scripts/tests/test-gfs-real-pg-minikube-gate.sh

      # The NetworkPolicy probe runs on an E2E-only fixture that the default
      # (pulled) setup never acquires. This proves the target says so up front
      # instead of timing out on ErrImageNeverPull, and that it still builds
      # nothing itself.
      - name: Test the NetworkPolicy probe-image preflight
        run: bash scripts/tests/test-minikube-verify-network-policy.sh

      # Runs the real pre-gate scripts against PATH stubs for
      # docker/minikube/kubectl/make in a throwaway repo copy. No cluster, no
      # network. It proves a ghcr pre-gate retags its local build onto the ref
      # the Deployment runs, which is the only thing standing between a green
      # gate and a green gate about undeployed code.
      - name: Test pre-gate shadow builds and image-mode resolution
        run: bash scripts/tests/test-minikube-pre-gate-shadow.sh

      - name: Test pre-gate sync state contract
        run: bash scripts/tests/test-minikube-pre-gate-sync-state.sh

      - name: Test pre-gate runtime assertions
        run: bash scripts/tests/test-minikube-pre-gate-runtime.sh

      # ADMIN_PASSWORD is a required precondition of full-setup.sh Step 1 on the
      # default (minimal) seed profile. Two cases in this harness execute the
      # script against stubbed docker/minikube/kubectl, so without it they abort
      # at Step 1. Developers get it from .env; CI has none, so supply a
      # throwaway value. It never leaves the stubbed run.
      - name: Test full-setup image source, tag override and banner
        env:
          ADMIN_PASSWORD: ci-stubbed-run-not-a-real-password
        run: bash scripts/tests/test-minikube-full-setup.sh

      - name: Test release image resolution
        run: bash scripts/tests/test-resolve-release-images.sh

      - name: Test release image promotion
        run: bash scripts/tests/test-promote-release-images.sh

  # ─── Platform NGINX image guard (CVE baseline) ────────────────────────────
  nginx-image-guard:
    name: Validate platform NGINX images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run NGINX image guard
        run: bash scripts/validate-nginx-images.sh

  # ─── Cf-Access header-read guard ──────────────────────────────────────────
  cf-access-header-guard:
    name: Validate Cf-Access header reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No unannotated Cf-Access-* header reads
        run: bash scripts/check-no-cf-access-header-read.sh

  # ─── Dockerfile CA-bundle guard ───────────────────────────────────────────
  # An image that ships git/curl/wget but no CA bundle fails every TLS
  # verification while Node's own fetch keeps working, so it looks healthy until
  # an agent shells out. Assert the dependency is declared, not inherited.
  dockerfile-ca-guard:
    name: Validate Dockerfile CA bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every image shipping a TLS tool installs ca-certificates
        run: bash scripts/check-dockerfile-ca-certificates.sh

  # ─── Deploy manifest check (public overlays) ──────────────────────────────
  # The public repo carries base + minikube overlays only; the gcp-dev/gcp-prod
  # overlays live in keyper-labs/evenfire-infra and are rendered by infra CI.
  # Here we render the minikube overlays and assert the base/overlay contracts
  # that are checkable without the gcp overlays.
  deploy-manifest-check:
    name: Deploy Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kubectl (pinned)
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Render minikube overlays
        run: |
          # The minikube k8s-api-ip patch is rendered from a template at setup
          # time (deploy/scripts/minikube-detect-k8s-api-ip.sh) and gitignored, so
          # a fresh checkout has only the .template. Render a placeholder CIDR here
          # so `kubectl kustomize` can build the overlay in CI (no cluster needed).
          sed 's#__K8S_API_IP__#10.96.0.1#g' \
            deploy/overlays/minikube/patches/k8s-api-ip.yaml.template \
            > deploy/overlays/minikube/patches/k8s-api-ip.yaml
          kubectl kustomize deploy/overlays/minikube > /tmp/clerum-minikube.yaml
          kubectl kustomize deploy/overlays/minikube-no-uis > /tmp/clerum-minikube-no-uis.yaml

      - name: cloudflared must not render into the minikube overlays
        run: |
          for f in /tmp/clerum-minikube.yaml /tmp/clerum-minikube-no-uis.yaml; do
            if grep -q 'name: cloudflared' "$f"; then
              echo "::error::cloudflared leaked into $f (minikube must not include the ingress namespace)"
              exit 1
            fi
          done

      # ── #273 retirement gate ─────────────────────────────────────────
      # The static `clerum-channel-reader` Deployment was retired in #273.
      # Per-Host pods (`channel-reader-<host>`) created by HCC now own the
      # channel-reader role. Re-introducing the static Deployment would collide
      # with per-Host pods on Telegram's `getUpdates` long-poll (Telegram 409s
      # the loser). ServiceAccount/ConfigMap/ClusterRole/ClusterRoleBinding named
      # `clerum-channel-reader` ARE allowed — they're shared by per-Host pods.
      - name: No static clerum-channel-reader Deployment (issue #273)
        run: |
          python3 - <<'PY'
          import re, sys
          fail = False
          for path in ('/tmp/clerum-minikube.yaml', '/tmp/clerum-minikube-no-uis.yaml'):
              with open(path) as f:
                  text = f.read()
              for doc in re.split(r'^---\s*$', text, flags=re.MULTILINE):
                  if not doc.strip():
                      continue
                  kind = None
                  name = None
                  for line in doc.splitlines():
                      m = re.match(r'^kind:\s*(\S+)', line)
                      if m:
                          kind = m.group(1)
                          continue
                      m = re.match(r'^  name:\s*(\S+)', line)
                      if m and name is None:
                          name = m.group(1)
                  if kind == 'Deployment' and name == 'clerum-channel-reader':
                      sys.stderr.write(
                          f"::error file={path}::"
                          f"Static `clerum-channel-reader` Deployment is reintroduced. "
                          f"This was retired in #273 — use per-Host `channel-reader-<host>` "
                          f"pods created by HCC instead.\n"
                      )
                      fail = True
          sys.exit(1 if fail else 0)
          PY

  # ─── Leak guards: infra identifiers + secrets ─────────────────────────────
  # The public repo must never carry the private GCP project, GKE context
  # names, non-sanctioned *.evenfire.ai hostnames (infra-identifier denylist),
  # or real credentials (gitleaks). gitleaks scans the tracked tree via
  # `git archive` so the result is deterministic (no .git internals, no
  # node_modules) and matches the .gitleaks.toml calibration.
  leak-guards:
    name: Leak guards (identifiers + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: No internal infrastructure identifiers
        run: bash scripts/ci/check-no-infra-identifiers.sh

      - name: Install gitleaks (pinned)
        run: |
          VER=8.30.1
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks secret scan (tracked tree)
        run: |
          mkdir -p /tmp/gl-scan
          git archive --format=tar HEAD | tar -x -C /tmp/gl-scan
          cd /tmp/gl-scan
          gitleaks dir . -c "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --no-banner --redact --exit-code 1
