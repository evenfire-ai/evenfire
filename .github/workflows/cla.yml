name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]
jobs:
  cla:
    runs-on: ubuntu-latest
    # PAUSED: CLA.md is still "DRAFT — PENDING LEGAL REVIEW" and carries unfilled
    # placeholders ([legal entity name], [jurisdiction], [contact email]). Until
    # counsel clears it, we do not ask contributors to sign it. Re-enable by
    # dropping the `false &&` below once CLA.md is final.
    #
    # The CLA assistant needs secrets.CLA_PAT and writes to this repo's
    # signatures/cla.json; forks have neither, so let them skip.
    if: false && github.repository == 'evenfire-ai/evenfire'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/evenfire-ai/evenfire/blob/main/CLA.md'
          branch: 'main'
