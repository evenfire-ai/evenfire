name: Claude PR Review

# Automatic Claude review on every internal pull request.
#
# NOTE (public repo): PRs opened from forks do not receive repository secrets,
# so CLAUDE_CODE_OAUTH_TOKEN is unavailable for them. The `if:` guard on the job
# skips fork PRs to avoid a confusing red failure. External contributors can
# still request a review on demand by mentioning @claude (see claude.yml).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip fork PRs (no secret access) and draft PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a focused code review of this pull request. Prioritize:

            1. Correctness and edge cases — logic errors, off-by-one, null/error handling.
            2. Security — input validation, auth/authz, secret handling, injection.
            3. Performance — obvious bottlenecks, N+1 queries, resource leaks.
            4. Tests — coverage for new behavior and important edge cases.
            5. Clarity — readability and maintainability of the changed code.

            Leave inline comments for specific issues and a short top-level
            summary. Be concise; skip praise-only comments. If the change looks
            good, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
