name: Desktop App Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop-app-release.yaml'
      - 'desktop-app/package.json'

permissions:
  contents: write

concurrency:
  group: desktop-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect desktop app version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./desktop-app/package.json').version")"
          if [[ -z "${current_version}" ]]; then
            echo "::error::desktop-app/package.json does not define a version."
            exit 1
          fi

          previous_version=""
          before_sha="${{ github.event.before }}"
          if [[ -n "${before_sha}" && "${before_sha}" != "0000000000000000000000000000000000000000" ]]; then
            if git show "${before_sha}:desktop-app/package.json" > /tmp/desktop-package-before.json 2>/dev/null; then
              previous_version="$(node -p "require('/tmp/desktop-package-before.json').version || ''")"
            fi
          fi

          should_release=false
          if [[ "${current_version}" != "${previous_version}" ]]; then
            should_release=true
          fi

          tag="desktop-app-${current_version}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

          echo "Desktop app version: ${previous_version:-<none>} -> ${current_version}"
          echo "Release required: ${should_release}"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: x64
            runner: macos-15-intel
            script: make:mac:x64
          - platform: mac
            arch: arm64
            runner: macos-15
            script: make:mac:arm64
          - platform: windows
            arch: x64
            runner: windows-2025
            script: make:windows:x64
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            script: make:windows:arm64
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            script: make:linux:x64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            script: make:linux:arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Make desktop app
        working-directory: desktop-app
        run: npm run ${{ matrix.script }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: evenfire-desktop-${{ needs.detect-version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-app/out/make/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish desktop app release
    needs:
      - detect-version
      - build
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/evenfire-desktop-builds

      - name: Package release assets
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/evenfire-desktop-release-assets
          for artifact_dir in /tmp/evenfire-desktop-builds/evenfire-desktop-"${VERSION}"-*; do
            asset_name="$(basename "${artifact_dir}")"
            (
              cd "${artifact_dir}"
              zip -r "/tmp/evenfire-desktop-release-assets/${asset_name}.zip" .
            )
          done

          asset_count="$(find /tmp/evenfire-desktop-release-assets -type f -name '*.zip' | wc -l | tr -d ' ')"
          if [[ "${asset_count}" != "6" ]]; then
            echo "::error::Expected 6 desktop build assets, found ${asset_count}."
            find /tmp/evenfire-desktop-release-assets -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Generate release manifest asset
        run: |
          node scripts/release/update-desktop-release-manifest.mjs \
            --previous "${{ github.event.before }}" \
            --release-id "desktop-app-${{ needs.detect-version.outputs.version }}" \
            > /tmp/evenfire-desktop-release-assets/desktop-release-manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "${TAG}" /tmp/evenfire-desktop-release-assets/* \
            --title "Evenfire Desktop ${VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes "Desktop app ${VERSION} built from ${GITHUB_SHA}."
