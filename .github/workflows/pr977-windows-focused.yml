name: PR 977 exact-source Windows plugin DACL verification

on:
  push:
    branches:
      - test/pr977-windows-68b8ea74-20261030-r24l11
    paths:
      - .validation/windows/focused-test-target.txt
      - .validation/windows/focused-test-cases.json
      - .github/workflows/pr977-windows-focused.yml
      - scripts/pr977/windows-diagnostic-reporter.mjs
      - scripts/pr977/run-vitest-with-watchdog.mjs
      - scripts/pr977/test-run-vitest-with-watchdog.mjs
      - scripts/pr977/test-windows-diagnostic-reporter.mjs
      - scripts/pr977/test-sanitize-windows-vitest-report.mjs
      - scripts/pr977/verify-focused-windows-report.mjs
      - scripts/pr977/focused-windows-plan.mjs
      - scripts/pr977/run-focused-windows-processes.mjs
      - scripts/pr977/test-focused-windows-validation.mjs
      - scripts/pr977/test-verify-plugin-storage-prevhead-proof.mjs
      - scripts/pr977/test-aggregate-windows-full-shards.mjs
      - scripts/pr977/sanitize-windows-vitest-report.mjs

permissions:
  contents: read

concurrency:
  group: pr977-windows-focused-r24l11
  cancel-in-progress: false

env:
  PR977_SOURCE_SHA: 585ab1466433c3bbb5120152baca17daafe7ef6f

jobs:
  focused-windows-plugin-dacl:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out exact application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 585ab1466433c3bbb5120152baca17daafe7ef6f
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Check out diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source and harness revisions
        shell: pwsh
        run: |
          $sourceSha = (git -C source rev-parse HEAD).Trim()
          $harnessSha = (git -C validation rev-parse HEAD).Trim()
          $nodePin = (Get-Content source/.nvmrc -Raw).Trim()
          Write-Output "Workflow trigger SHA: $env:GITHUB_SHA"
          Write-Output "Diagnostic harness SHA: $harnessSha"
          Write-Output "Application source SHA: $sourceSha"
          if ($sourceSha -ne $env:PR977_SOURCE_SHA -or $harnessSha -ne $env:GITHUB_SHA) {
            throw 'Application source or harness SHA mismatch'
          }
          if ($nodePin -ne '24.22.1') { throw 'Unexpected repository Node pin' }
          $targets = @(Get-Content validation/.validation/windows/focused-test-target.txt |
            ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($targets.Count -ne 1 -or $targets[0] -ne 'src/__tests__/pluginStorageWindowsAcl.native.test.ts') {
            throw 'Focused native plugin DACL manifest is incomplete or unexpected'
          }
          $caseManifest = Get-Content validation/.validation/windows/focused-test-cases.json -Raw |
            ConvertFrom-Json
          $selectedCases = @($caseManifest.selected)
          $deselectedCases = @($caseManifest.deselected)
          $processes = @($caseManifest.processes)
          if ($selectedCases.Count -ne 5 -or $deselectedCases.Count -ne 9 -or
              ($selectedCases.Count + $deselectedCases.Count) -ne 14 -or $processes.Count -ne 2) {
            throw 'Focused native plugin DACL case manifest has an unexpected selection size'
          }
          if ($processes[0].id -ne 'consent' -or @($processes[0].selected).Count -ne 4 -or
              $processes[0].maximumRuntimeMs -ne 345000 -or $processes[0].noProgressMs -ne 120000) {
            throw 'Focused consent process selection or budget is incorrect'
          }
          if ($processes[1].id -ne 'audit-rotation' -or @($processes[1].selected).Count -ne 1 -or
              $processes[1].maximumRuntimeMs -ne 180000 -or $processes[1].noProgressMs -ne 120000) {
            throw 'Focused audit-rotation process selection or budget is incorrect'
          }
          if (-not (Test-Path -LiteralPath (Join-Path source/desktop-app $targets[0]) -PathType Leaf)) {
            throw 'The selected native plugin DACL test is missing from the pinned source'
          }

      - name: Set up repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: source/desktop-app/package-lock.json

      - name: Install declared Desktop dependencies
        working-directory: source/desktop-app
        run: npm ci

      - name: Prepare the checked-out Windows native helper
        working-directory: source/desktop-app
        shell: pwsh
        run: |
          npm run prepare:windows-native
          if ($LASTEXITCODE -ne 0) { throw 'Native helper preparation failed' }
          if (-not (Test-Path -LiteralPath 'resources/WindowsSessionAuthorityNative.dll' -PathType Leaf)) {
            throw 'The checked-out native helper was not produced'
          }

      - name: Verify Windows diagnostic harness contracts
        working-directory: source/desktop-app
        shell: pwsh
        run: |
          $env:CODEX_SCRATCH_ROOT = $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'evenfire') | Out-Null
          node ../../validation/scripts/pr977/test-sanitize-windows-vitest-report.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Sanitizer contract tests failed' }
          node ../../validation/scripts/pr977/test-focused-windows-validation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Focused process and report contracts failed' }
          node ../../validation/scripts/pr977/test-windows-diagnostic-reporter.mjs `
            (Get-Location).Path (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic reporter contract tests failed' }
          node ../../validation/scripts/pr977/test-run-vitest-with-watchdog.mjs
          if ($LASTEXITCODE -ne 0) { throw 'External watchdog contract tests failed' }
          node ../../validation/scripts/pr977/test-verify-plugin-storage-prevhead-proof.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Previous-head proof verifier contract tests failed' }
          node ../../validation/scripts/pr977/test-aggregate-windows-full-shards.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows shard aggregation contract tests failed' }

      - name: Verify fixed native stderr phase capture
        working-directory: source/desktop-app
        shell: pwsh
        run: |
          $testName = '^Windows plugin storage native evidence contract classifies a native process timeout without treating it as safe evidence$'
          node node_modules/vitest/vitest.mjs run --testTimeout=10000 --hookTimeout=10000 `
            --maxWorkers=1 --no-file-parallelism --retry=0 `
            --testNamePattern $testName src/__tests__/pluginStorageWindowsAcl.contract.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native stderr phase capture contract failed' }

      - name: Run focused consent and audit processes with independent watchdogs
        id: focused
        working-directory: source/desktop-app
        shell: pwsh
        env:
          EVENFIRE_REQUIRE_WINDOWS_ACL_TEST: '1'
        run: |
          $env:PR977_DESKTOP_ROOT = (Get-Location).Path
          node ../../validation/scripts/pr977/run-focused-windows-processes.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Focused native DACL validation did not pass' }

      - name: Preserve sanitized reports and progress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr977-focused-plugin-dacl-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr977-focused/source-identity.json
            ${{ runner.temp }}/pr977-focused/focused-summary.json
            ${{ runner.temp }}/pr977-focused/process-consent/focused-report.json
            ${{ runner.temp }}/pr977-focused/process-consent/progress.jsonl
            ${{ runner.temp }}/pr977-focused/process-consent/watchdog-status.json
            ${{ runner.temp }}/pr977-focused/process-consent/verified-result.json
            ${{ runner.temp }}/pr977-focused/process-audit-rotation/focused-report.json
            ${{ runner.temp }}/pr977-focused/process-audit-rotation/progress.jsonl
            ${{ runner.temp }}/pr977-focused/process-audit-rotation/watchdog-status.json
            ${{ runner.temp }}/pr977-focused/process-audit-rotation/verified-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce focused native result
        if: always()
        shell: pwsh
        env:
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
        run: |
          if ($env:FOCUSED_RESULT -ne 'success') { throw 'Focused native DACL verification failed' }
