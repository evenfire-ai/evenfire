name: PR 977 exact-source Windows focused validation

on:
  push:
    branches:
      - test/pr977-windows-95d67a36-20261029-r24m4
    paths:
      - .validation/windows/focused-test-target.txt
      - .github/workflows/pr977-windows-focused.yml
      - scripts/pr977/sanitize-focused-windows-test.mjs

permissions:
  contents: read

concurrency:
  group: pr977-windows-focused-95d67a36
  cancel-in-progress: false

env:
  PR977_SOURCE_SHA: 95d67a364ec23924ea5647988e94e39af8e04080

jobs:
  focused-windows-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exact application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 95d67a364ec23924ea5647988e94e39af8e04080
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Check out diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact revisions and repository Node pin
        shell: pwsh
        run: |
          $sourceSha = (git -C source rev-parse HEAD).Trim()
          $harnessSha = (git -C validation rev-parse HEAD).Trim()
          $nodePin = (Get-Content source/.nvmrc -Raw).Trim()
          Write-Output "Workflow trigger SHA: $env:GITHUB_SHA"
          Write-Output "Harness checkout SHA: $harnessSha"
          Write-Output "Application source SHA: $sourceSha"
          if ($sourceSha -ne $env:PR977_SOURCE_SHA -or $harnessSha -ne $env:GITHUB_SHA) {
            throw 'The checked-out source or harness SHA does not match its pin'
          }
          if ($nodePin -ne '24.22.1') { throw 'Unexpected repository Node pin' }

      - name: Set up repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            source/mcp-host/package-lock.json
            source/desktop-app/package-lock.json

      - name: Install declared project dependencies
        shell: pwsh
        run: |
          npm --prefix source/mcp-host ci
          if ($LASTEXITCODE -ne 0) { throw 'Host dependency installation failed' }
          npm --prefix source/desktop-app ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }

      - name: Prepare the checked-out Windows native helper
        working-directory: source/desktop-app
        shell: pwsh
        run: |
          npm run prepare:windows-native
          if ($LASTEXITCODE -ne 0) { throw 'Native helper preparation failed' }
          if (-not (Test-Path -LiteralPath 'resources/WindowsSessionAuthorityNative.dll' -PathType Leaf)) {
            throw 'The checked-out native helper was not produced'
          }

      - name: Run exactly one focused source test file with a process watchdog
        shell: pwsh
        run: |
          $target = (Get-Content validation/.validation/windows/focused-test-target.txt -Raw).Trim()
          $allowedTargets = @(
            'appService.passwordLoginRollback.regression.test.ts',
            'appService.pendingExternalLogoutKeytarUnavailable.test.ts',
            'appService.persistenceMutation.contract.test.ts',
            'windowsSessionAuthorityAcl.native.test.ts',
            'windowsSessionAuthorityDurableFileOps.native.test.ts'
          )
          if ($target -notin $allowedTargets) { throw 'Focused Windows target is not allowlisted' }
          if ($target -eq 'windowsSessionAuthorityAcl.native.test.ts') {
            $env:EVENFIRE_REQUIRE_WINDOWS_ACL_TEST = '1'
          }
          if ($target -eq 'windowsSessionAuthorityDurableFileOps.native.test.ts') {
            $env:EVENFIRE_REQUIRE_WINDOWS_DURABLE_TEST = '1'
          }

          $report = Join-Path $env:RUNNER_TEMP 'focused-report.json'
          $metaPath = Join-Path $env:RUNNER_TEMP 'focused-meta.json'
          $node = (Get-Command node).Source
          $vitest = Join-Path $env:GITHUB_WORKSPACE 'source/desktop-app/node_modules/vitest/vitest.mjs'
          $deadlineSeconds = if ($target -eq 'windowsSessionAuthorityAcl.native.test.ts') { 1800 } else { 300 }
          $started = [DateTime]::UtcNow
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $node
          $startInfo.WorkingDirectory = Join-Path $env:GITHUB_WORKSPACE 'source/desktop-app'
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $sourceTestPath = Join-Path $startInfo.WorkingDirectory ('src/__tests/' + $target)
          $sourceTestFileExists = Test-Path -LiteralPath $sourceTestPath -PathType Leaf
          if (-not $sourceTestFileExists) { throw 'The selected source test file is absent' }
          foreach ($argument in @(
            $vitest, 'run', '--maxWorkers=1', '--no-file-parallelism',
            '--testTimeout=120000', '--hookTimeout=120000', '--reporter=json',
            ('--outputFile.json=' + $report), $sourceTestPath
          )) {
            [void]$startInfo.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) { throw 'The focused Vitest process did not start' }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          $watchdogExpired = $false
          $deadline = $started.AddSeconds($deadlineSeconds)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 2
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            $watchdogExpired = $true
            Write-Output 'The external watchdog expired; terminating only the focused Vitest process tree.'
            & taskkill.exe /PID $process.Id /T /F *> $null
            $process.WaitForExit()
          }
          $process.WaitForExit()
          $stdoutText = $stdoutTask.GetAwaiter().GetResult()
          $stderrText = $stderrTask.GetAwaiter().GetResult()
          $combinedText = $stdoutText + "`n" + $stderrText
          $failureClass = if ($watchdogExpired) { 'watchdog-expired' }
            elseif ($process.ExitCode -eq 0) { 'none' }
            elseif ($combinedText -match 'No test files found') { 'no-test-files' }
            elseif ($combinedText -match 'Failed to load config') { 'config-load' }
            elseif ($combinedText -match 'Unknown option') { 'invalid-option' }
            elseif ($combinedText -match 'AssertionError|Test Files\s+[0-9]+ failed') {
              'test-failure'
            } else { 'unclassified-process-failure' }
          [ordered]@{
            exitCode = if ($watchdogExpired) { $null } else { $process.ExitCode }
            watchdogExpired = $watchdogExpired
            elapsedSeconds = [Math]::Round(([DateTime]::UtcNow - $started).TotalSeconds, 1)
            reportPresent = Test-Path -LiteralPath $report -PathType Leaf
            reportBytes = if (Test-Path -LiteralPath $report -PathType Leaf) {
              (Get-Item -LiteralPath $report).Length
            } else { 0 }
            stdoutBytes = [Text.Encoding]::UTF8.GetByteCount($stdoutText)
            stderrBytes = [Text.Encoding]::UTF8.GetByteCount($stderrText)
            sourceTestFileExists = $sourceTestFileExists
            failureClass = $failureClass
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $metaPath -Encoding utf8
          $env:PR977_AUTH_TEST_FILE = $target
          node validation/scripts/pr977/sanitize-focused-windows-test.mjs $report $metaPath `
            (Join-Path $env:RUNNER_TEMP 'focused-result.safe.json')
          if ($LASTEXITCODE -ne 0) { throw 'The focused Windows source test did not pass its result contract' }

      - name: Preserve sanitized focused Windows result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr977-windows-focused-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/focused-result.safe.json
            ${{ runner.temp }}/focused-meta.json
          if-no-files-found: warn
          retention-days: 14
