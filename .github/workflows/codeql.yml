name: CodeQL

# Static analysis for a platform whose pitch is a security model: deny-all
# networking, approval gates, signature-verified webhooks, scoped RPC tokens.
# The code enforcing those claims (rpc-proxy's JWT chain, webhook-gateway's HMAC
# verification, HCC's NetworkPolicy generation) had no SAST gate before this.
#
# build-mode: none — CodeQL analyses JS/TS from source and does not need the ~33
# workspaces built, which keeps this a single job rather than a matrix.
#
# False-positive dispositions for js/missing-rate-limiting (custom PG limiter) are
# recorded in docs/how-to/codeql-js-missing-rate-limiting.md with Security-tab
# dismissals; do not globally exclude that query in config.

on:
  push:
    # dev is the integration branch where feature PRs land first; without it,
    # code merged to dev goes unscanned until it reaches main, and PRs targeting
    # dev never get a CodeQL run at all (their alerts freeze the moment a PR is
    # retargeted away from main).
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Manual re-run: lets a maintainer re-scan a branch after a fix without
  # waiting for the weekly schedule (e.g. to clear an alert whose PR was
  # retargeted from main to dev mid-review).
  workflow_dispatch:
  schedule:
    # Weekly, so newly-published CodeQL queries reach the default branch even in
    # a quiet week. Monday 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Code scanning is FREE on public repositories but requires paid GitHub
    # Advanced Security on private ones. This repo is still private pending the
    # public launch, so uploading results fails with:
    #   "Code Security must be enabled for this repository to use code scanning."
    #
    # Rather than leave a permanently-red check (which trains everyone to ignore
    # CI) or pay for GHAS on a repo that is about to be public anyway, the job is
    # gated on visibility. It costs nothing today and starts enforcing itself the
    # moment the repo flips to public — no follow-up commit required.
    #
    # Nothing else is needed at that point: just verify the run appears under the
    # Security tab.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write # upload results to the Security tab
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          db-location: ${{ runner.temp }}/codeql-databases

      - name: Test repository CodeQL queries
        env:
          CODEQL: ${{ steps.codeql-init.outputs.codeql-path }}
        run: |
          "$CODEQL" pack install .github/codeql/queries
          "$CODEQL" pack install \
            --additional-packs=.github/codeql/queries \
            .github/codeql/queries/test
          .github/codeql/queries/test/verify-security-and-quality-suite.sh "$CODEQL"
          "$CODEQL" test run \
            --additional-packs=.github/codeql/queries \
            .github/codeql/queries/test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: '/language:javascript-typescript'

      - name: Verify production CodeQL source scope
        env:
          CODEQL_DATABASE_ROOT: ${{ runner.temp }}/codeql-databases
        run: |
          source_archive="$(find "$CODEQL_DATABASE_ROOT" -type f -name src.zip -print -quit)"
          if [[ -z "$source_archive" ]]; then
            echo '::error::CodeQL source archive was not found'
            exit 1
          fi

          source_listing="$RUNNER_TEMP/codeql-production-sources.txt"
          unzip -Z1 "$source_archive" > "$source_listing"
          if grep -Fq '/.github/codeql/queries/test/' "$source_listing"; then
            echo '::error::Synthetic CodeQL query fixtures entered production analysis'
            exit 1
          fi

          for expected_source in \
            '/control-api/src/main.ts' \
            '/external-rest-api/src/main.ts' \
            '/desktop-app/src/main.ts'
          do
            if ! grep -Fq "$expected_source" "$source_listing"; then
              echo "::error::Expected application source is missing: $expected_source"
              exit 1
            fi
          done
