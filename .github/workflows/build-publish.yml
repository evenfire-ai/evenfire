name: Build & Publish

# Builds each service image and pushes it to GitHub Container Registry
# (ghcr.io/evenfire-ai/*) using the built-in GITHUB_TOKEN only — zero cloud
# secrets live in this public repo. The private infra repo mirrors these images
# ghcr -> GCP Artifact Registry (digest-identical) and deploys by digest.
#
# Change-detected like the legacy deploy build: only images whose source paths
# changed since the previous commit are (re)built. A manual run with
# build_all=true rebuilds the whole matrix (use this for the first publish, or
# to repopulate ghcr).
#
# Every image is built multi-arch (amd64 + arm64), not amd64-only: minikube
# pulls these images directly onto arm64 hardware (Apple Silicon laptops), so
# any image minikube can reach needs an arm64 leg, and building the whole
# list uniformly avoids maintaining a separate opt-out list. Three published
# images -- mcp-host-desktop, clerum-workflow-base, playwright-server -- are
# not minikube-deployed and could drop the arm64 leg later if runner cost
# matters; not done here, since it would only save three legs and would also
# require the visibility guard to stop asserting arm64 for those three. Each
# arch is built natively — no QEMU — as its own `build-push` matrix leg on a
# runner that matches (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64),
# pushed by digest, then the `merge` job combines the two digests into one
# manifest list per image and pushes the sha-<7> and latest tags.

on:
  push:
    # `dev` is the integration branch → drives the clerum-dev deploy (build →
    # dispatch → infra mirror + apply). `main` is the release branch (→ clerum
    # prod via a dev→main promotion) and does NOT build/dispatch here — prod
    # promotes dev-proven digests, it never rebuilds. The main→prod trigger is
    # added with the prod pipeline (see the cutover spec, Phase 2).
    branches: [dev]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build and push every image regardless of changed paths'
        type: boolean
        default: false

# Least-privilege default: only build-push and merge need to write packages
# (build-push pushes per-arch digests, merge pushes the combined manifest
# list). The source preflight, detect (runs the third-party paths-filter
# action), and notify-infra get read-only permissions, so a compromised action
# in those jobs cannot push images to ghcr.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NAMESPACE: evenfire-ai

jobs:
  # This intentionally repeats the cheap incoming-diff Prettier check from CI:
  # the publishing workflow is an independent enforcement boundary. Manual
  # dispatches have no bounded push range, so they require a successful CI push
  # run for the exact selected commit instead.
  preflight:
    name: Source preflight
    if: github.repository == 'evenfire-ai/evenfire'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/prettier-source-preflight.yml
    with:
      allowed_branches: dev
      base_sha: ${{ github.event.before || '' }}
      head_sha: ${{ github.sha }}
      mode: ${{ github.event_name == 'workflow_dispatch' && 'exact-ci' || 'direct' }}

  detect:
    name: Detect changed images
    needs: preflight
    runs-on: ubuntu-latest
    # Publishing targets ghcr.io/evenfire-ai/*, which forks cannot write to.
    # Guarding the preflight and this entry job cascades: build-push needs
    # detect, merge needs build-push, and notify-infra needs merge, so a fork
    # skips the whole workflow cleanly.
    if: github.repository == 'evenfire-ai/evenfire'
    outputs:
      force_all: ${{ steps.base.outputs.force_all }}
      channel-reader: ${{ steps.filter.outputs.channel-reader }}
      workflow-approval-request-reader: ${{ steps.filter.outputs.workflow-approval-request-reader }}
      control-api: ${{ steps.filter.outputs.control-api }}
      control-ui: ${{ steps.filter.outputs.control-ui }}
      external-rest-api: ${{ steps.filter.outputs.external-rest-api }}
      host-context-controller: ${{ steps.filter.outputs.host-context-controller }}
      mcp-host: ${{ steps.filter.outputs.mcp-host }}
      mcp-proxy: ${{ steps.filter.outputs.mcp-proxy }}
      gfs-controller: ${{ steps.filter.outputs.gfs-controller }}
      nginx-egress-proxy: ${{ steps.filter.outputs.nginx-egress-proxy }}
      profile-ui: ${{ steps.filter.outputs.profile-ui }}
      rpc-proxy: ${{ steps.filter.outputs.rpc-proxy }}
      workflow-recipes: ${{ steps.filter.outputs.workflow-recipes }}
      stdio-bridge: ${{ steps.filter.outputs.stdio-bridge }}
      workspace-files-controller: ${{ steps.filter.outputs.workspace-files-controller }}
      airtable-mcp-server: ${{ steps.filter.outputs.airtable-mcp-server }}
      playwright-server: ${{ steps.filter.outputs.playwright-server }}
      web-search-mcp: ${{ steps.filter.outputs.web-search-mcp }}
      mock-mcp-server: ${{ steps.filter.outputs.mock-mcp-server }}
      mock-stdio-mcp-server: ${{ steps.filter.outputs.mock-stdio-mcp-server }}
      webhook-gateway: ${{ steps.filter.outputs.webhook-gateway }}
      webhook-proxy: ${{ steps.filter.outputs.webhook-proxy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve build mode
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BUILD_ALL: ${{ inputs.build_all }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$BUILD_ALL" = "true" ]; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # first push / new branch / unknown base — build everything
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        id: filter
        if: steps.base.outputs.force_all != 'true'
        # SHA-pinned (v4): third-party, individual-maintainer action — pin so a
        # hijacked tag can't run arbitrary code in a job that has repo write.
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          base: ${{ github.event.before }}
          filters: |
            channel-reader:
              - 'channel-reader/**'
            workflow-approval-request-reader:
              - 'workflow-approval-request-reader/**'
            control-api:
              - 'control-api/**'
              - 'packages/workflow-runtime-core/**'
              - 'packages/workflow-recipe-capability-policy/**'
              - 'packages/image-policy/**'
            control-ui:
              - 'control-ui/**'
              - 'packages/workflow-recipe-capability-policy/**'
            external-rest-api:
              - 'external-rest-api/**'
            host-context-controller:
              - 'host-context-controller/**'
              - 'packages/workflow-recipe-capability-policy/**'
              - 'packages/image-policy/**'
              - 'packages/network-policy-core/**'
            mcp-host:
              - 'mcp-host/**'
            mcp-proxy:
              - 'mcp-proxy/**'
            gfs-controller:
              - 'gfs-controller/**'
            nginx-egress-proxy:
              - 'nginx-egress-proxy/**'
            profile-ui:
              - 'profile-ui/**'
              - 'packages/desktop-app-links/**'
            rpc-proxy:
              - 'rpc-proxy/**'
            workflow-recipes:
              - 'workflow-recipes/**'
              - 'packages/workflow-runtime-core/**'
              - 'packages/workflow-sdk/**'
              - 'packages/workflow-recipe-capability-policy/**'
              - 'packages/image-policy/**'
              - 'packages/network-policy-core/**'
              - 'scripts/e2e/**'
              - 'tests/e2e/fixtures/**'
            stdio-bridge:
              - 'stdio-bridge/**'
            workspace-files-controller:
              - 'workspace-files-controller/**'
            airtable-mcp-server:
              - 'mcp-servers/airtable/**'
            playwright-server:
              - 'mcp-servers/playwright/**'
            web-search-mcp:
              - 'mcp-servers/web-search/**'
            mock-mcp-server:
              - 'tests/e2e/fixtures/mock-mcp-server/**'
            mock-stdio-mcp-server:
              - 'tests/e2e/fixtures/mock-stdio-mcp-server/**'
            webhook-gateway:
              - 'webhook-gateway/**'
            webhook-proxy:
              - 'webhook-proxy/**'

  build-push:
    name: Build & push (${{ matrix.image }}-${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: detect
    permissions:
      contents: read
      packages: write
    # Gate at step level: the `matrix` context is not available in a job-level
    # `if`, so each step checks whether this image changed (or a full build was
    # requested). Unchanged images spin an empty job and exit fast.
    strategy:
      fail-fast: false
      matrix:
        # `image` must be a real dimension here, not just a key inside each
        # `include` entry. `arch` is the only *other* dimension, so the base
        # cross-product is arch x image = 2 x 28 = 56 combinations; each
        # `include` entry below (keyed by `image`) then merges its
        # path/dockerfile/rooted/changed fields onto only the 2 combinations
        # (one per arch) that share its `image` value. Drop the `image:`
        # dimension and arch would be the *only* base dimension (2 total
        # combinations), and all 28 `include` entries would stack onto those
        # same 2, each overwriting the last — every leg ending up with
        # whichever image's fields were declared last in the list.
        arch: [amd64, arm64]
        image:
          - channel-reader
          - workflow-approval-request-reader
          - control-api
          - control-ui
          - external-rest-api
          - host-context-controller
          - mcp-host
          - mcp-host-slim
          - mcp-host-full
          - mcp-host-desktop
          - mcp-proxy
          - gfs-controller
          - nginx-egress-proxy
          - profile-ui
          - rpc-proxy
          - workflow-recipes
          - workflow-coordinator
          - workflow-snippet-runner
          - clerum-workflow-base
          - stdio-bridge
          - workspace-files-controller
          - airtable-mcp-server
          - playwright-server
          - web-search-mcp
          - mock-mcp-server
          - mock-stdio-mcp-server
          - webhook-gateway
          - webhook-proxy
        include:
          - image: channel-reader
            path: channel-reader
            changed: ${{ needs.detect.outputs.channel-reader }}
          - image: workflow-approval-request-reader
            path: workflow-approval-request-reader
            changed: ${{ needs.detect.outputs.workflow-approval-request-reader }}
          - image: control-api
            path: control-api
            rooted: true
            changed: ${{ needs.detect.outputs.control-api }}
          - image: control-ui
            path: control-ui
            rooted: true
            changed: ${{ needs.detect.outputs.control-ui }}
          - image: external-rest-api
            path: external-rest-api
            changed: ${{ needs.detect.outputs.external-rest-api }}
          - image: host-context-controller
            path: host-context-controller
            rooted: true
            changed: ${{ needs.detect.outputs.host-context-controller }}
          - image: mcp-host
            path: mcp-host
            rooted: true
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-slim
            path: mcp-host
            rooted: true
            dockerfile: Dockerfile.slim
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-full
            path: mcp-host
            rooted: true
            dockerfile: Dockerfile.full
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-desktop
            path: mcp-host
            rooted: true
            dockerfile: Dockerfile.desktop
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-proxy
            path: mcp-proxy
            changed: ${{ needs.detect.outputs.mcp-proxy }}
          - image: gfs-controller
            path: gfs-controller
            changed: ${{ needs.detect.outputs.gfs-controller }}
          - image: nginx-egress-proxy
            path: nginx-egress-proxy
            changed: ${{ needs.detect.outputs.nginx-egress-proxy }}
          - image: profile-ui
            path: profile-ui
            rooted: true
            changed: ${{ needs.detect.outputs.profile-ui }}
          - image: rpc-proxy
            path: rpc-proxy
            changed: ${{ needs.detect.outputs.rpc-proxy }}
          - image: workflow-recipes
            path: workflow-recipes
            rooted: true
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: workflow-coordinator
            path: workflow-recipes
            dockerfile: Dockerfile.coordinator
            rooted: true
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: workflow-snippet-runner
            path: workflow-recipes
            rooted: true
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: clerum-workflow-base
            path: packages/workflow-sdk
            dockerfile: Dockerfile.base
            rooted: true
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: stdio-bridge
            path: stdio-bridge
            changed: ${{ needs.detect.outputs.stdio-bridge }}
          - image: workspace-files-controller
            path: workspace-files-controller
            changed: ${{ needs.detect.outputs.workspace-files-controller }}
          - image: airtable-mcp-server
            path: mcp-servers/airtable
            changed: ${{ needs.detect.outputs.airtable-mcp-server }}
          - image: playwright-server
            path: mcp-servers/playwright
            changed: ${{ needs.detect.outputs.playwright-server }}
          - image: web-search-mcp
            path: mcp-servers/web-search
            changed: ${{ needs.detect.outputs.web-search-mcp }}
          - image: mock-mcp-server
            path: tests/e2e/fixtures/mock-mcp-server
            changed: ${{ needs.detect.outputs.mock-mcp-server }}
          - image: mock-stdio-mcp-server
            path: tests/e2e/fixtures/mock-stdio-mcp-server
            changed: ${{ needs.detect.outputs.mock-stdio-mcp-server }}
          - image: webhook-gateway
            path: webhook-gateway
            changed: ${{ needs.detect.outputs.webhook-gateway }}
          - image: webhook-proxy
            path: webhook-proxy
            changed: ${{ needs.detect.outputs.webhook-proxy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}

      # No QEMU: each leg now builds only its own native arch (amd64 on
      # ubuntu-latest, arm64 on ubuntu-24.04-arm), so there is nothing to
      # emulate. This is the whole point of the split.
      - name: Set up Docker Buildx
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context and Dockerfile
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        id: buildargs
        env:
          MATRIX_PATH: ${{ matrix.path }}
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
          MATRIX_ROOTED: ${{ matrix.rooted }}
        run: |
          # Rooted services COPY from sibling directories (packages/*) so their
          # Docker build context must be the repo root and the Dockerfile path
          # is fully qualified.
          if [ "$MATRIX_ROOTED" = "true" ]; then
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "file=$MATRIX_PATH/${MATRIX_DOCKERFILE:-Dockerfile}" >> "$GITHUB_OUTPUT"
          else
            echo "context=$MATRIX_PATH" >> "$GITHUB_OUTPUT"
            echo "file=$MATRIX_PATH/${MATRIX_DOCKERFILE:-Dockerfile}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ steps.buildargs.outputs.context }}
          file: ${{ steps.buildargs.outputs.file }}
          platforms: linux/${{ matrix.arch }}
          # Attestations are disabled per-leg. Provenance attestations don't
          # push cleanly in push-by-digest mode (they need a repo:tag target,
          # not a bare digest push), and `docker buildx imagetools create`
          # flattens the source indexes it merges rather than carrying
          # per-platform attestation manifests forward -- so provenance could
          # not survive to the merged index anyway. Re-add later with a
          # dedicated attest step on the merged index if supply-chain
          # metadata is wanted back.
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # Per-arch scope: each arch now builds in its own job/leg (see the
          # split above), so each needs its own gha cache scope. Before this
          # change, one job built both platforms in a single buildx
          # invocation and correctly shared one scope -- that's no longer
          # true now that the legs are split.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      # Digests cross to the merge job via per-arch artifacts, the same
      # upload/download-artifact pattern the built-image markers use (see the
      # merge job below — that's also where the marker itself now lives: it
      # means "this image is real", which is only true once the manifest list
      # exists, not merely once one arch's digest has landed).
      - name: Record built-image digest
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}-${{ matrix.arch }}"

      - name: Upload digest artifact
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.image }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: warn

  # Combines the two per-arch digests from build-push into one multi-platform
  # manifest list per image, and pushes the sha-<7> and latest tags. This is
  # also where the built-image marker now lives (moved from build-push): the
  # marker means "this image is real", which is only true once the manifest
  # list exists — a lone amd64 or arm64 digest is not a publishable image.
  merge:
    name: Merge manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect, build-push]
    permissions:
      contents: read
      packages: write
    # Gate at step level, same as build-push and for the same reason (the
    # `matrix` context is unavailable in a job-level `if`). This is a
    # deliberate choice, not an oversight: it preserves today's exact
    # behavior on an all-unchanged push. Every leg's steps skip, but the job
    # itself still runs and succeeds, so notify-infra (needs: merge) still
    # runs too and takes its own "no images built" no-op branch — exactly
    # what happens today when build-push is all-unchanged. Gating `merge` at
    # the job level instead would make an all-unchanged push SKIP the job
    # outright, which cascades to skip notify-infra as well (a job's default
    # `if` is implicitly `&& success()`, and a skipped need does not satisfy
    # that) instead of letting it run and no-op. Both are legitimate designs;
    # this one was picked to change as little observable behavior as
    # possible in this refactor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: channel-reader
            changed: ${{ needs.detect.outputs.channel-reader }}
          - image: workflow-approval-request-reader
            changed: ${{ needs.detect.outputs.workflow-approval-request-reader }}
          - image: control-api
            changed: ${{ needs.detect.outputs.control-api }}
          - image: control-ui
            changed: ${{ needs.detect.outputs.control-ui }}
          - image: external-rest-api
            changed: ${{ needs.detect.outputs.external-rest-api }}
          - image: host-context-controller
            changed: ${{ needs.detect.outputs.host-context-controller }}
          - image: mcp-host
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-slim
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-full
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-host-desktop
            changed: ${{ needs.detect.outputs.mcp-host }}
          - image: mcp-proxy
            changed: ${{ needs.detect.outputs.mcp-proxy }}
          - image: gfs-controller
            changed: ${{ needs.detect.outputs.gfs-controller }}
          - image: nginx-egress-proxy
            changed: ${{ needs.detect.outputs.nginx-egress-proxy }}
          - image: profile-ui
            changed: ${{ needs.detect.outputs.profile-ui }}
          - image: rpc-proxy
            changed: ${{ needs.detect.outputs.rpc-proxy }}
          - image: workflow-recipes
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: workflow-coordinator
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: workflow-snippet-runner
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: clerum-workflow-base
            changed: ${{ needs.detect.outputs.workflow-recipes }}
          - image: stdio-bridge
            changed: ${{ needs.detect.outputs.stdio-bridge }}
          - image: workspace-files-controller
            changed: ${{ needs.detect.outputs.workspace-files-controller }}
          - image: airtable-mcp-server
            changed: ${{ needs.detect.outputs.airtable-mcp-server }}
          - image: playwright-server
            changed: ${{ needs.detect.outputs.playwright-server }}
          - image: web-search-mcp
            changed: ${{ needs.detect.outputs.web-search-mcp }}
          - image: mock-mcp-server
            changed: ${{ needs.detect.outputs.mock-mcp-server }}
          - image: mock-stdio-mcp-server
            changed: ${{ needs.detect.outputs.mock-stdio-mcp-server }}
          - image: webhook-gateway
            changed: ${{ needs.detect.outputs.webhook-gateway }}
          - image: webhook-proxy
            changed: ${{ needs.detect.outputs.webhook-proxy }}
    steps:
      - name: Set up Docker Buildx
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exact artifact names, not a `digest-${{ matrix.image }}-*` glob:
      # several image names share a prefix (mcp-host, mcp-host-slim,
      # mcp-host-full, mcp-host-desktop), and a wildcard suffix on the image
      # name would also match the sibling images' digest artifacts.
      - name: Download amd64 digest
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digest-${{ matrix.image }}-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digest-${{ matrix.image }}-arm64
          path: /tmp/digests

      - name: Compute short SHA
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        id: shortsha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}"
          AMD64_DIGEST="$(cat "/tmp/digests/${{ matrix.image }}-amd64")"
          ARM64_DIGEST="$(cat "/tmp/digests/${{ matrix.image }}-arm64")"
          # The per-leg label on each platform manifest's config is not
          # readable from the index itself (imagetools inspect --raw on the
          # tag shows no revision without resolving a child manifest and
          # pulling its config blob per platform). Task 4's resolver reads
          # org.opencontainers.image.revision to pick the digest to promote,
          # so it also needs to be an index-level annotation.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMG:sha-${{ steps.shortsha.outputs.sha }}" \
            -t "$IMG:latest" \
            "$IMG@$AMD64_DIGEST" \
            "$IMG@$ARM64_DIGEST"

      # Record that this image was actually (re)built + pushed at this sha, so
      # notify-infra can tell the infra repo EXACTLY which images to mirror/pin
      # (build-publish is change-detected — an incremental merge builds a subset).
      - name: Record built-image marker
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        run: mkdir -p /tmp/built && echo "${{ matrix.image }}" > "/tmp/built/${{ matrix.image }}"

      - name: Upload built-image marker
        if: ${{ matrix.changed == 'true' || needs.detect.outputs.force_all == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-${{ matrix.image }}
          path: /tmp/built/${{ matrix.image }}
          retention-days: 1
          if-no-files-found: warn

  # Notify the private infra repo that a fresh image set is available so it can
  # mirror ghcr -> GCP Artifact Registry and bump the dev pins. Dormant until the
  # operator sets the INFRA_DISPATCH_REPO variable and INFRA_DISPATCH_TOKEN secret;
  # the nightly reconcile poll in the infra repo is the missed-event safety net.
  notify-infra:
    name: Dispatch images-published
    runs-on: ubuntu-latest
    # Must be `merge`, not `build-push`: the built-image markers live in the
    # merge job now (a manifest list, not a lone per-arch digest, is what
    # makes an image real). If this pointed at build-push, it would become a
    # sibling of merge instead of a dependent, download zero markers, and
    # take the "no images built" no-op branch below on every push that
    # actually built something — failing GREEN with no ghcr mirror and no
    # clerum-dev apply.
    needs: merge
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_all }}
    steps:
      - name: Collect built-image markers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/built
          pattern: built-*
          merge-multiple: true
        continue-on-error: true
      - name: Fire repository_dispatch to the infra repo
        env:
          DISPATCH_REPO: ${{ vars.INFRA_DISPATCH_REPO }}
          DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        if: ${{ env.DISPATCH_REPO != '' && env.DISPATCH_TOKEN != '' }}
        run: |
          set -euo pipefail
          # download-artifact creates nothing when zero markers match, so
          # /tmp/built may not exist. Ensure it does — otherwise `find` errors
          # and, under `set -e`, fails the job before the empty-check runs
          # (a no-op push must skip cleanly, not go red).
          mkdir -p /tmp/built
          # Space-separated list of images actually (re)built this run. Empty on a
          # no-op / config-only push — in which case DO NOT dispatch (nothing to
          # mirror; a bare dispatch would make the mirror fail on absent tags).
          IMAGES="$(find /tmp/built -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | tr '\n' ' ' | sed 's/ *$//')"
          if [ -z "$IMAGES" ]; then
            echo "no images built (no-op / config-only push) — skipping dispatch"
            exit 0
          fi
          echo "built images: $IMAGES"
          payload="$(jq -cn --arg sha "$SHA" --arg short "${SHA:0:7}" --arg images "$IMAGES" \
            '{event_type:"images-published",client_payload:{sha:$sha,short_sha:$short,images:$images}}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/$DISPATCH_REPO/dispatches" \
            -d "$payload"
          echo "dispatched images-published for: $IMAGES"
