name: PR 1085 temporary R26 Windows native verification

on:
  push:
    branches:
      - test/pr1085-r26-native-win-20261106
    paths:
      - .validation/pr1085/native.trigger

permissions:
  contents: read

concurrency:
  group: pr1085-r26-native-win-20261106
  cancel-in-progress: false

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source and native test filesystem
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checkout does not match workflow source SHA' }
          $manifest = Get-Content .validation/pr1085/source-manifest.json -Raw | ConvertFrom-Json
          Write-Output "CANDIDATE_BASE=$($manifest.candidateBase)"
          foreach ($entry in $manifest.files) {
            $content = [System.IO.File]::ReadAllText($entry.path, [System.Text.Encoding]::UTF8)
            $normalized = $content.Replace("`r`n", "`n").Replace("`r", "`n")
            $hashBytes = [System.Security.Cryptography.SHA256]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes($normalized))
            $hash = [Convert]::ToHexString($hashBytes).ToLowerInvariant()
            if ($hash -ne $entry.sha256) { throw "Candidate source hash mismatch: $($entry.path)" }
          }
          Write-Output "CANDIDATE_FILES_VERIFIED=$($manifest.files.Count)"
          Write-Output "SOURCE_SHA=$actual"
          Get-Volume -DriveLetter $env:SystemDrive.Substring(0,1) |
            Select-Object DriveLetter, FileSystem, FileSystemLabel | Format-List
          node --version
          if ((Get-Content .nvmrc -Raw).Trim() -ne '24.22.1') { throw 'Unexpected Node pin' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install Desktop dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Verify Electron runtime
        working-directory: desktop-app
        run: npm run verify:electron
      - name: Build Desktop main and native bridge
        working-directory: desktop-app
        run: npm run build:main
      - name: Prepare distinct non-admin Q principal and isolated filesystems
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qName = 'gfsq' + ([guid]::NewGuid().ToString('N').Substring(0, 8))
          $qPassword = ([guid]::NewGuid().ToString('N') + 'aA1!')
          Write-Output "::add-mask::$qName"
          Write-Output "::add-mask::$qPassword"
          $secure = ConvertTo-SecureString $qPassword -AsPlainText -Force
          New-LocalUser -Name $qName -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          $qSid = (Get-LocalUser -Name $qName).SID.Value
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if ($qSid -eq $currentSid) { throw 'Q principal must differ from the runner principal' }
          $admins = Get-LocalGroupMember -Group Administrators | ForEach-Object SID | ForEach-Object Value
          if ($qSid -in $admins) { throw 'Q principal must not be an administrator' }
          Add-Content -Path $env:GITHUB_ENV -Value "GFS_Q_USERNAME=$qName"
          Add-Content -Path $env:GITHUB_ENV -Value "GFS_Q_PASSWORD=$qPassword"

          $vhd = 'C:\gfs-r26-refs.vhdx'
          $diskpart = @"
          create vdisk file=$vhd maximum=4096 type=expandable
          select vdisk file=$vhd
          attach vdisk
          create partition primary
          format fs=refs quick label=GFSR26
          assign letter=R
          exit
          "@
          $diskpartPath = Join-Path $env:RUNNER_TEMP 'gfs-r26-diskpart.txt'
          Set-Content -Path $diskpartPath -Value $diskpart -Encoding ASCII
          diskpart /s $diskpartPath
          if ($LASTEXITCODE -ne 0) { throw "DiskPart ReFS setup failed: $LASTEXITCODE" }

          function Set-TestRootAcl([string]$Root) {
            New-Item -ItemType Directory -Force -Path $Root | Out-Null
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true, $false)
            $principals = @(
              @{ Sid = $currentSid; Rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
              @{ Sid = 'S-1-5-18'; Rights = [System.Security.AccessControl.FileSystemRights]::FullControl },
              @{ Sid = 'S-1-5-32-544'; Rights = [System.Security.AccessControl.FileSystemRights]::FullControl }
            )
            foreach ($principal in $principals) {
              $identity = [System.Security.Principal.SecurityIdentifier]::new($principal.Sid)
              $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
                $identity, $principal.Rights,
                [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
                [System.Security.AccessControl.PropagationFlags]::None,
                [System.Security.AccessControl.AccessControlType]::Allow)
              $acl.AddAccessRule($rule)
            }
            $qIdentity = [System.Security.Principal.SecurityIdentifier]::new($qSid)
            $traverse = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $qIdentity, [System.Security.AccessControl.FileSystemRights]::Traverse,
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit,
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($traverse)
            Set-Acl -LiteralPath $Root -AclObject $acl
          }

          Set-TestRootAcl 'C:\gfs-r26-ntfs'
          Set-TestRootAcl 'R:\gfs-r26-refs'
          if ((Get-Volume -DriveLetter C).FileSystem -ne 'NTFS') { throw 'NTFS root is not on NTFS' }
          if ((Get-Volume -DriveLetter R).FileSystem -ne 'ReFS') { throw 'R: is not a real ReFS volume' }
          Write-Output "Q_SID=$qSid"
          Write-Output "RUNNER_SID=$currentSid"
          Get-Volume -DriveLetter C, R | Select-Object DriveLetter, FileSystem, FileSystemLabel | Format-Table
      - name: Run native filesystem and owner tests on NTFS
        shell: pwsh
        working-directory: desktop-app
        run: |
          $ErrorActionPreference = 'Stop'
          $env:EVENFIRE_GFS_POWERSHELL_PATH = Join-Path $PSHOME 'pwsh.exe'
          if ((Get-Volume -DriveLetter C).FileSystem -ne 'NTFS') { throw 'NTFS precondition failed' }
          $env:EVENFIRE_GFS_SAVE_TEST_ROOT = 'C:\gfs-r26-ntfs'
          node --test native/gfs_save_bridge.test.cjs
          $nativeExit = $LASTEXITCODE
          npm exec -- vitest run src/__tests__/gfsSaveOwner.test.ts src/__tests__/gfsSaveS147.integration.test.ts src/__tests__/ipc.gfsSaveToDisk.test.ts src/__tests__/appService.nativeCommit.test.ts
          $ownerExit = $LASTEXITCODE
          "R26_NTFS_NATIVE_EXIT=$nativeExit" | Add-Content $env:GITHUB_ENV
          "R26_NTFS_OWNER_EXIT=$ownerExit" | Add-Content $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
          exit 0
      - name: Run native filesystem and owner tests on ReFS
        shell: pwsh
        working-directory: desktop-app
        run: |
          $ErrorActionPreference = 'Stop'
          $env:EVENFIRE_GFS_POWERSHELL_PATH = Join-Path $PSHOME 'pwsh.exe'
          if ((Get-Volume -DriveLetter R).FileSystem -ne 'ReFS') { throw 'ReFS precondition failed' }
          $env:EVENFIRE_GFS_SAVE_TEST_ROOT = 'R:\gfs-r26-refs'
          node --test native/gfs_save_bridge.test.cjs
          $nativeExit = $LASTEXITCODE
          npm exec -- vitest run src/__tests__/gfsSaveOwner.test.ts src/__tests__/gfsSaveS147.integration.test.ts src/__tests__/ipc.gfsSaveToDisk.test.ts src/__tests__/appService.nativeCommit.test.ts
          $ownerExit = $LASTEXITCODE
          "R26_REFS_NATIVE_EXIT=$nativeExit" | Add-Content $env:GITHUB_ENV
          "R26_REFS_OWNER_EXIT=$ownerExit" | Add-Content $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
          exit 0
      - name: Enforce native and owner test results from both filesystems
        if: always()
        shell: pwsh
        run: |
          $failures = @()
          foreach ($name in @('R26_NTFS_NATIVE_EXIT', 'R26_NTFS_OWNER_EXIT', 'R26_REFS_NATIVE_EXIT', 'R26_REFS_OWNER_EXIT')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -eq $value -or $value -ne '0') { $failures += "$name=$value" }
          }
          if ($failures.Count -gt 0) { throw "Native acceptance failed: $($failures -join ', ')" }
      - name: Remove task-owned Windows test principal and ReFS volume
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $qName = $env:GFS_Q_USERNAME
          if ($qName) { Remove-LocalUser -Name $qName -ErrorAction SilentlyContinue }
          $volume = Get-Volume -DriveLetter R -ErrorAction SilentlyContinue
          if ($volume) {
            mountvol R: /D | Out-Null
            $diskpartPath = Join-Path $env:RUNNER_TEMP 'gfs-r26-detach.txt'
            @('select vdisk file=C:\gfs-r26-refs.vhdx', 'detach vdisk', 'exit') |
              Set-Content -Path $diskpartPath -Encoding ASCII
            diskpart /s $diskpartPath | Out-Null
          }
          Remove-Item -Force -ErrorAction SilentlyContinue 'C:\gfs-r26-refs.vhdx'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'C:\gfs-r26-ntfs', 'R:\gfs-r26-refs'
