name: Release images

# Promotes dev-proven digests to a release tag. Never rebuilds -- prod promotes
# what dev proved, per the rule build-publish.yml states in its own header.
#
# Prerequisite: no image carries an org.opencontainers.image.revision
# annotation until build-publish.yml has run at least once with
# build_all=true on dev (that's what the merge step writes it from). Until
# that first full-matrix run happens, this workflow will correctly refuse
# every image rather than promote one it cannot verify.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to rehearse against (dry run, promotes nothing)'
        required: true

permissions:
  contents: read

jobs:
  resolve-release-ref:
    name: Resolve release commit
    if: >-
      github.repository == 'evenfire-ai/evenfire' &&
      (github.event_name != 'workflow_dispatch' ||
        (github.ref == 'refs/heads/main' && github.workflow_sha == github.sha))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || 'refs/heads/main' }}

      - name: Peel release ref to its commit
        id: resolve
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          trusted_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            candidate="$RELEASE_REF"
            if ! git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$candidate"
            fi
          else
            git check-ref-format --branch "$RELEASE_REF" >/dev/null
            git fetch --force origin "$RELEASE_REF"
            candidate=FETCH_HEAD
          fi
          sha="$(git rev-parse --verify --end-of-options "${candidate}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "trusted_sha=$trusted_sha" >> "$GITHUB_OUTPUT"

  preflight:
    name: Exact-CI release preflight
    needs: resolve-release-ref
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/exact-ci-provenance.yml
    with:
      allowed_branches: main
      head_sha: ${{ needs.resolve-release-ref.outputs.sha }}
      trusted_sha: ${{ needs.resolve-release-ref.outputs.trusted_sha }}

  promote:
    name: Promote images
    needs: [resolve-release-ref, preflight]
    runs-on: ubuntu-latest
    # Forks cannot write to ghcr.io/evenfire-ai/*, and a fork's v* tag would
    # otherwise produce a red run against a namespace it does not own.
    if: >-
      github.repository == 'evenfire-ai/evenfire' &&
      needs.resolve-release-ref.result == 'success' &&
      needs.preflight.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
        (github.ref == 'refs/heads/main' && github.workflow_sha == github.sha))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # resolve-release-images.mjs runs `git merge-base --is-ancestor` and
          # `git diff` against a commit that may be far back on dev. A shallow
          # checkout has neither.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve-release-ref.outputs.trusted_sha }}

      - name: Fetch the selected release commit as data
        env:
          TAG_SHA: ${{ needs.resolve-release-ref.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${TAG_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$TAG_SHA"
          fi
          git cat-file -e "${TAG_SHA}^{commit}"

      - name: Install crane
        run: |
          set -euo pipefail
          VER=v0.20.2
          # sudo on the extract, matching ci-public.yml's precedent for
          # installing a binary into /usr/local/bin (kubectl at :411,
          # gitleaks at :495). This path only runs for real on a release
          # tag push, so it can't be rehearsed beforehand -- match what's
          # already proven rather than relying on the non-sudo form hosted
          # runners happen to permit today.
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${VER}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and promote
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref_name }}
          TAG_SHA: ${{ needs.resolve-release-ref.outputs.sha }}
        run: bash scripts/release/promote-release-images.sh
