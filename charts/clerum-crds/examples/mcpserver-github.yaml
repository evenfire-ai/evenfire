# Example: GitHub MCP Server
# Provides GitHub API tools
apiVersion: clerum.io/v1alpha1
kind: McpServer
metadata:
  name: github-server
spec:
  contextRef: context1
  description: Provides GitHub repository management tools
  image: mcp/github:latest
  transport:
    type: sse
    url: http://github-server.mcp-server.svc.cluster.local:3000/sse
    port: 3000
  env:
    - name: MCP_TRANSPORT
      value: "sse"
    - name: MCP_HOST
      value: "0.0.0.0"
    - name: MCP_PORT
      value: "3000"
  envSecret:
    name: github-mcp-credentials
    keys:
      - secretKey: github-token
        envVar: GITHUB_TOKEN
  healthCheck:
    port: 3001
  auth:
    type: bearer
    secretRef: github-mcp-credentials
    secretKey: github-token
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  enabled: true
