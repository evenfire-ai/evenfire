apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hosts.clerum.io
  annotations:
    clerum.io/secret-reference-contract: |-
      {
        "version": 1,
        "plural": "hosts",
        "fields": [
          {
            "path": "spec.secretRef",
            "namespaceBinding": "host-secret"
          }
        ]
      }
  labels:
    app.kubernetes.io/name: host
    app.kubernetes.io/part-of: clerum
spec:
  group: clerum.io
  names:
    kind: Host
    listKind: HostList
    plural: hosts
    singular: host
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Host is the central entity that uses a context and connects to channels and MPC servers.
          properties:
            spec:
              type: object
              required:
                - host
                - contextRef
              x-kubernetes-validations:
                - rule: "(has(self.model) && has(self.model.provider) && self.model.provider == 'codex-subscription' && (!has(self.llmPolicy) || !has(self.llmPolicy.fallbacks) || !self.llmPolicy.fallbacks.exists(f, f.provider != 'codex-subscription'))) || (has(self.model) && has(self.model.provider) && self.model.provider == 'grok-subscription' && (!has(self.llmPolicy) || !has(self.llmPolicy.fallbacks) || !self.llmPolicy.fallbacks.exists(f, f.provider != 'grok-subscription'))) || (has(self.secretRef) && size(self.secretRef) > 0)"
                  message: spec.secretRef is required unless every LLM target is the same oauth-broker provider
                - rule: "!has(self.llmPolicy) || !has(self.llmPolicy.fallbacks) || !self.llmPolicy.fallbacks.exists(f, (f.provider == 'codex-subscription' || f.provider == 'grok-subscription') && has(f.credentialSlot))"
                  message: credentialSlot is not supported for oauth-broker providers
                - rule: "!(((has(self.model) && has(self.model.provider) && self.model.provider == 'codex-subscription') || (has(self.llmPolicy) && has(self.llmPolicy.fallbacks) && self.llmPolicy.fallbacks.exists(f, f.provider == 'codex-subscription')) || (has(self.allowedModels) && self.allowedModels.exists(m, m.provider == 'codex-subscription'))) && ((has(self.model) && has(self.model.provider) && self.model.provider == 'grok-subscription') || (has(self.llmPolicy) && has(self.llmPolicy.fallbacks) && self.llmPolicy.fallbacks.exists(f, f.provider == 'grok-subscription')) || (has(self.allowedModels) && self.allowedModels.exists(m, m.provider == 'grok-subscription'))))"
                  message: a Host may declare at most one oauth-broker provider
              properties:
                host:
                  type: string
                  description: >-
                    Display name for this agent, freely editable (spaces and
                    capitals allowed). It is the human-facing visible name, not an
                    identifier — the immutable RFC1123 identifier is metadata.name.
                    Length is validated by control-api (free text; no pattern here).
                contextRef:
                  type: string
                  description: Reference to the context (e.g. context1) used for MPC servers and secrets.
                secretRef:
                  type: string
                  description: >-
                    Name of the Kubernetes Secret containing static LLM API keys.
                    Required when any primary or fallback target uses
                    static-credentials. Optional for a Codex-subscription-only Host.
                channels:
                  type: array
                  description: List of CommunicationChannel names this host interacts with.
                  items:
                    type: string
                model:
                  type: object
                  description: LLM model configuration.
                  properties:
                    provider:
                      type: string
                      enum:
                        - openai
                        - claude
                        - zai
                        - bailian
                        - vertex
                        - bedrock
                        - openrouter
                        - gemini
                        - deepseek
                        - groq
                        - together
                        - fireworks
                        - mistral
                        - xai
                        - cerebras
                        - deepinfra
                        - perplexity
                        - moonshot
                        - nebius
                        - novita
                        - minimax
                        - azure
                        - codex-subscription
                        - grok-subscription
                      description: LLM provider to use.
                    name:
                      type: string
                      description: Model name (e.g. gpt-5.4-mini, claude-opus-4-7, glm-5.1).
                    connectionRef:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
                      description: >-
                        Named Codex subscription key this Host is assigned to.
                        Absent or empty Codex Hosts persist unassigned and must
                        not spend a grant. Do not invent deployment-default.
                        ROLLOUT ORDER — CRD FIRST: apiextensions/v1 prunes unknown
                        fields, so this property must be applied before control-api
                        or Control UI persist spec.model.connectionRef.
                allowedModels:
                  maxItems: 32
                  # Per-host model allowlist subset (spec v2 Topic 3a). OPTIONAL,
                  # ADDITIVE: when absent or empty, the host offers the FULL global
                  # operator allowlist for its provider(s) — existing hosts are
                  # unaffected (back-compat). When set, it is the subset of the
                  # global allowlist this host offers: the per-session model
                  # selector (desktop-app, GET /v1/runtime/model[s]) and the
                  # write-time validation both restrict to this subset ∩ the live
                  # global allowlist. control-api validates every entry against the
                  # global allowlist on write — each (provider, model) pair must
                  # exist there. `provider` is a plain string (not enum'd here) so
                  # the global allowlist stays the single source of truth for valid
                  # pairs and adding a provider needn't touch a third enum.
                  type: array
                  items:
                    type: object
                    required:
                      - provider
                      - model
                    properties:
                      provider:
                        type: string
                        description: >-
                          LLM provider id; validated against the global allowlist
                          by control-api.
                      model:
                        type: string
                        description: >-
                          Model name; must exist in the global allowlist under
                          `provider`.
                llmPolicy:
                  # Provider fallback (spec v2 R5). ADDITIVE, OPT-IN: a Host with
                  # no llmPolicy behaves exactly as before (zero failover). When
                  # the primary model fails with an eligible error, mcp-host
                  # switches to the first available entry in `fallbacks`.
                  #
                  # ROLLOUT ORDER — CRD FIRST. apiextensions/v1 silently PRUNES
                  # unknown fields: if the runtime writes a Host with `llmPolicy`
                  # while the OLD CRD (without this schema) is still applied, the
                  # apiserver drops `llmPolicy` on admission with no error. Always
                  # apply this CRD before rolling out any component that reads or
                  # writes `spec.llmPolicy` (mcp-host, control-api).
                  type: object
                  description: >-
                    LLM provider fallback policy (opt-in). When the primary model
                    (spec.model) fails with an eligible error, mcp-host switches to
                    the first available entry in `fallbacks`, applies a cooldown to
                    the primary, and lazily retries it once the cooldown expires.
                    Every fallback model must be enabled in the operator allowlist
                    (validated on write by control-api).
                  required:
                    - fallbacks
                  properties:
                    cooldownSeconds:
                      type: integer
                      minimum: 0
                      default: 300
                      description: >-
                        Seconds the primary stays in cooldown after an eligible
                        failure before mcp-host lazily retries it. Default 300.
                    triggerOn:
                      type: array
                      description: >-
                        Error classes that trigger a fallback. Omit for the default
                        (all four classes). Restrict this list to avoid failing over
                        on unrecognized/transport errors (folded into
                        provider_unavailable).
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        enum:
                          - insufficient_quota
                          - auth
                          - provider_unavailable
                          - rate_limited
                    fallbacks:
                      type: array
                      minItems: 1
                      maxItems: 8
                      description: >-
                        Ordered fallback list, tried in order. The engine advances
                        to the next entry when the current one also fails.
                      items:
                        type: object
                        required:
                          - provider
                          - model
                        properties:
                          provider:
                            type: string
                            enum:
                              - openai
                              - claude
                              - zai
                              - bailian
                              - vertex
                              - bedrock
                              - openrouter
                              - gemini
                              - deepseek
                              - groq
                              - together
                              - fireworks
                              - mistral
                              - xai
                              - cerebras
                              - deepinfra
                              - perplexity
                              - moonshot
                              - nebius
                              - novita
                              - minimax
                              - azure
                              - codex-subscription
                              - grok-subscription
                            description: >-
                              Fallback LLM provider. Same enum as spec.model.provider.
                          model:
                            type: string
                            description: >-
                              Fallback model name. Must be enabled in the operator
                              allowlist under `provider` (enforced on write).
                          credentialSlot:
                            type: string
                            # Defense-in-depth: mirror control-api's write-side
                            # format gate onto the CRD so a direct cluster apply
                            # (bypassing control-api) still gets a valid K8s Secret
                            # data key. Same pattern/length as SECRET_KEY_RE.
                            maxLength: 253
                            pattern: '^[-._a-zA-Z0-9]+$'
                            description: >-
                              Optional key of the Host's OWN `spec.secretRef` Secret
                              that feeds this fallback's credential (e.g. claude-api-key-fb1
                              for a same-provider-other-key fallback). mcp-host resolves
                              fallback slots from the Host secret. Absent = the provider's
                              normal slots. Existence of the key in the Secret is resolved
                              by mcp-host at runtime; control-api validates only its format
                              on write.
                approval:
                  type: object
                  description: Tool approval configuration. Controls who can approve tool executions.
                  properties:
                    defaultPolicy:
                      type: string
                      enum:
                        - cli_only
                        - channel_users
                        - designated_approvers
                      description: >-
                        Who can approve tool calls.
                        cli_only: Only HTTP /approve /deny endpoints.
                        channel_users: Any authorized channel user.
                        designated_approvers: Only users in approvers list.
                    channels:
                      type: object
                      description: Per-channel-type approval settings.
                      properties:
                        telegram:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether Telegram users can approve.
                            approvers:
                              type: array
                              description: List of Telegram user IDs allowed to approve.
                              items:
                                type: string
                        email:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether email users can approve.
                            approvers:
                              type: array
                              description: List of email addresses allowed to approve.
                              items:
                                type: string
                        slack:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether Slack users can approve.
                            approvers:
                              type: array
                              description: List of Slack user IDs allowed to approve.
                              items:
                                type: string
                    tools:
                      type: object
                      description: >-
                        Per-tool approval overrides for native mcp-host tools.
                        Map of native tool name (e.g. http_request, shell_exec)
                        to boolean: true forces approval, false skips approval.
                        Absent entries fall through to each tool's built-in default.
                        Out of scope: MCP tools (gated separately).
                      additionalProperties:
                        type: boolean
                desktop:
                  type: object
                  description: Desktop environment configuration. Enables a Linux desktop (XFCE + KasmVNC) with agent-accessible X11 and browser tools.
                  properties:
                    browser:
                      type: boolean
                      description: Enable Playwright browser tools (browser_open, browser_screenshot, etc.).
                    x11:
                      type: boolean
                      description: Enable X11 desktop tools (desktop_screenshot, desktop_click, desktop_type, etc.).
                lifecycle:
                  type: object
                  description: >-
                    Runtime lifecycle configuration. Cross-field constraints
                    (no CommunicationChannels, no desktop, satisfiable
                    SharedFileSystem co-location) are enforced at reconcile
                    time via the StatelessEnableRejected status condition, not
                    by this schema.
                  properties:
                    stateless:
                      type: boolean
                      default: false
                      description: >-
                        Enable the stateless agent lifecycle. mcp-host
                        persists session state to SQLite on the workspace PVC
                        and the operator may scale the Deployment to 0 while
                        status.lifecycle.state is suspended.
                workflowControl:
                  type: object
                  description: >-
                    Workflow broker scopes this first-party Host is allowed to
                    request in its mcp-host-control JWT. control-api remains the
                    authority for every workflow request; these scopes only
                    bound the broker tool surface available to the Host runtime.
                  properties:
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - workflow:list
                          - workflow:read
                          - workflow:trigger
                          - workflow:approval:resolve
                          - workflow:approval:decide
                      description: >-
                        Allowed workflow tool scopes. workflow_status and
                        workflow_health are covered by workflow:read; there is
                        no separate workflow_read native tool.
                personalization:
                  type: object
                  description: Identity files (admin-managed, read-only to the agent).
                  properties:
                    enabled:
                      type: boolean
                      description: Whether mcp-host should reconcile identity files from this block.
                    identity:
                      type: string
                      description: Content of IDENTITY.md (system-prompt section "## Identity").
                    soul:
                      type: string
                      description: Content of SOUL.md (system-prompt section "## Core Values").
                    agents:
                      type: string
                      description: Content of AGENTS.md (system-prompt section "## Agent Instructions").
                    user:
                      type: string
                      description: Content of USER.md (system-prompt section "## User Context").
                guardrails:
                  # Guardrail policy (guardrails spec §5). ADDITIVE, OPT-IN: a Host
                  # with no guardrails block behaves exactly as before — no rules, no
                  # installed hooks, no built-ins (byte-identical to prior behavior).
                  #
                  # ROLLOUT ORDER — CRD FIRST. apiextensions/v1 silently PRUNES
                  # unknown fields: if the runtime writes a Host with `guardrails`
                  # while the OLD CRD (without this schema) is applied, the apiserver
                  # drops it on admission with no error. Apply this CRD before any
                  # component reads or writes spec.guardrails (mcp-host, control-api).
                  # The loosely-typed `rules` and `builtins` entries carry
                  # x-kubernetes-preserve-unknown-fields so their nested shape (which
                  # mcp-host/control-api validate) survives admission rather than
                  # being pruned.
                  type: object
                  description: >-
                    Guardrail policy for this Host: ordered tool-lane rules,
                    installed LlmHook references grouped by lifecycle phase,
                    first-party built-ins, and the capability/trust ceilings that
                    bound the installed hooks.
                  properties:
                    rules:
                      type: array
                      description: >-
                        Ordered tool-lane allow/ask/deny rules, evaluated top-down.
                        Each entry: { id, action: allow|ask|deny, reasonCode,
                        match{ tool, arguments[] } } — shape validated by
                        mcp-host/control-api (§6.1).
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    hooks:
                      type: object
                      description: >-
                        Installed LlmHook CRs this Host runs, grouped by lifecycle
                        phase. Each entry references an LlmHook CR by name (llm-hooks
                        namespace) plus the expected image digest (§8.2 resolution).
                      properties:
                        preToolUse:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                        postToolUse:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                        preCall:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                        moderate:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                        postCallSuccess:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                        onError:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                              digest:
                                type: string
                    builtins:
                      type: array
                      description: >-
                        First-party hooks compiled into mcp-host (§7.2). Each entry:
                        { type: prompt-shaping|token-trim|…, order, failMode,
                        timeoutMs, config } — shape validated by mcp-host.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    minInstalledHookTrustLevel:
                      type: string
                      enum:
                        - low
                        - mid
                        - high
                      description: Minimum platform-assigned trust level an installed LlmHook must carry to run on this Host.
                    approvalPolicies:
                      type: array
                      description: >-
                        Approval policies available to guardrail `ask` decisions.
                        NOTE: overlaps conceptually with spec.approval.defaultPolicy;
                        reconciling the two is a follow-up decision.
                      items:
                        type: string
                        enum:
                          - cli_only
                          - channel_users
                          - designated_approvers
                    capabilityCeiling:
                      type: array
                      description: Upper bound on capabilities any installed hook may exercise on this Host.
                      items:
                        type: string
                        enum:
                          - may_deny
                          - may_rewrite
                          - may_substitute_result
                          - may_add_context
                    limits:
                      type: object
                      description: Guardrail sizing limits (defaults applied by mcp-host when omitted).
                      properties:
                        maxRules:
                          type: integer
                          default: 100
                        maxHooksPerPhase:
                          type: integer
                          default: 8
                        maxHookTimeoutMs:
                          type: integer
                          default: 5000
                        maxHookOutputBytes:
                          type: integer
                          default: 65536
            status:
              type: object
              properties:
                lifecycle:
                  type: object
                  description: >-
                    Durable stateless-lifecycle state. host-context-controller
                    derives Deployment replicas from state on every reconcile,
                    so a suspended Host survives controller restarts and
                    periodic resyncs.
                  required:
                    - state
                    - wakeHandledGeneration
                  properties:
                    state:
                      type: string
                      enum:
                        - active
                        - draining
                        - suspended
                    wakeHandledGeneration:
                      type: integer
                      description: Highest observed Host generation whose wake trigger has been handled.
                    reason:
                      type: string
                      description: Human-readable explanation when the stateless request was rejected.
                conversationStore:
                  type: object
                  description: >-
                    Controller-owned canonical conversation-store state (#825).
                    Only status.request is written by control-api's trusted
                    operator path; every other field is owned by
                    host-context-controller.
                  properties:
                    operatorProposal:
                      type: object
                      description: Controller-owned readonly preparation target; never grants mutation authority.
                      required: [schemaVersion, state, hostUid, pvcUid, storageContract, image]
                      x-kubernetes-validations:
                        - rule: "self.state != 'ready' || (has(self.templateRevision) && has(self.effectiveLifecycle) && has(self.sourceEnvironmentReferencesHash))"
                          message: Ready targets require exact current storage and environment reference pins.
                        - rule: "self.state != 'blocked' || (!has(self.templateRevision) && has(self.reason))"
                          message: Blocked targets cannot supply preparation pins.
                      properties:
                        schemaVersion: {type: integer, enum: [1]}
                        state: {type: string, enum: [ready, blocked]}
                        hostUid: {type: string, minLength: 1}
                        pvcUid: {type: string, minLength: 1}
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        image: {type: string, minLength: 1}
                        templateRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
                        effectiveLifecycle: {type: string, enum: [stateful, stateless, desktop]}
                        sourceEnvironmentReferencesHash: {type: string, pattern: '^[0-9a-f]{64}$'}
                        reason: {type: string, minLength: 1}
                    request:
                      type: object
                      description: Trusted operator request written via control-api (#825 section 5.6).
                      required:
                        - schemaVersion
                        - requestId
                        - operation
                        - hostUid
                        - pvcUid
                        - maintenanceId
                        - principal
                      properties:
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        schemaVersion:
                          type: integer
                          enum: [1]
                        requestId:
                          type: string
                          minLength: 1
                        operation:
                          type: string
                          enum: [maintenance, prepare, adopt, release]
                        hostUid:
                          type: string
                          minLength: 1
                        pvcUid:
                          type: string
                          minLength: 1
                        maintenanceId:
                          type: string
                          minLength: 1
                        principal:
                          type: object
                          description: Server-added authenticated principal; never caller-supplied.
                          required: [storageContract, kind, subject]
                          properties:
                            kind:
                              type: string
                              enum: [control-admin]
                            subject:
                              type: string
                              minLength: 1
                        targetImage:
                          type: string
                        templateRevision:
                          type: string
                          description: Storage-contract revision hash; excludes volatile credential values.
                        sourceClass:
                          type: string
                          enum: [sqlite-pvc, sqlite-external-exported, new-host, memory, unknown]
                        manifestHash:
                          type: string
                        exportId:
                          type: string
                        migrationId:
                          type: string
                        candidateHash:
                          type: string
                        expectedMigrationId:
                          type: string
                          description: Floor release/recovery pairing; requires current catalog hash.
                        expectedStoreId:
                          type: string
                          description: Recovery pairing only; never fabricate for plain adoption.
                        expectedCurrentCatalogHash:
                          type: string
                          description: Recovery pairing only; must accompany expectedStoreId.
                    requestResult:
                      type: object
                      description: Controller-owned, binding-bound acknowledgement of the trusted request (#825).
                      required: [storageContract, requestId, hostUid, pvcUid, state, updatedAt]
                      properties:
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        requestId:
                          type: string
                          minLength: 1
                        hostUid:
                          type: string
                          minLength: 1
                        pvcUid:
                          type: string
                          minLength: 1
                        state:
                          type: string
                          enum: [accepted, completed, rejected]
                        updatedAt:
                          type: string
                        reason:
                          type: string
                    compatibility:
                      type: object
                      description: Established contract level for the exact Host/PVC binding (#825).
                      required: [storageContract, schemaVersion, hostUid, pvcUid, contractVersion, establishedAt]
                      x-kubernetes-validations:
                        - rule: "self.storageContract != 'legacy-floor' || (has(self.layoutVersion) && has(self.migrationId) && has(self.databasePath) && has(self.writerFenceRoot) && has(self.catalogHash))"
                          message: Legacy floor requires its completed bound physical proof.
                      properties:
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        schemaVersion:
                          type: integer
                          enum: [1]
                        hostUid:
                          type: string
                          minLength: 1
                        pvcUid:
                          type: string
                          minLength: 1
                        contractVersion:
                          type: integer
                          enum: [1]
                        layoutVersion: {type: integer, enum: [1]}
                        migrationId: {type: string, minLength: 1}
                        databasePath: {type: string, enum: [state/state.db]}
                        writerFenceRoot: {type: string, enum: [state]}
                        catalogHash: {type: string, pattern: '^[0-9a-f]{64}$'}
                        establishedAt:
                          type: string
                    preparation:
                      type: object
                      description: Controller-owned preparation receipt gating the FIRST canonical rollout (#825).
                      required:
                        - storageContract
                        - schemaVersion
                        - requestId
                        - hostUid
                        - pvcUid
                        - templateRevision
                        - image
                        - sourceClass
                        - maintenanceId
                        - preparedAt
                        - provenance
                      properties:
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        schemaVersion:
                          type: integer
                          enum: [1]
                        requestId:
                          type: string
                          minLength: 1
                        hostUid:
                          type: string
                          minLength: 1
                        pvcUid:
                          type: string
                          minLength: 1
                        templateRevision:
                          type: string
                        image:
                          type: string
                        sourceClass:
                          type: string
                          enum: [sqlite-pvc, sqlite-external-exported, new-host, memory, unknown]
                        manifestHash:
                          type: string
                        exportId:
                          type: string
                        maintenanceId:
                          type: string
                        preparedAt:
                          type: string
                        verificationJobName:
                          type: string
                        verificationJobUid:
                          type: string
                        provenance:
                          type: string
                          enum: [new, existing]
                    layout:
                      type: object
                      description: Monotonic canonical layout commitment for the exact binding (#825).
                      required: [version, hostUid, pvcUid, state, committedAt]
                      properties:
                        version:
                          type: integer
                          enum: [1]
                        hostUid:
                          type: string
                          minLength: 1
                        pvcUid:
                          type: string
                          minLength: 1
                        state:
                          type: string
                          enum: [pending, ready]
                        committedAt:
                          type: string
                        storeId:
                          type: string
                    maintenance:
                      type: object
                      description: Durable maintenance state; wake/drain never cancels it (#825).
                      required: [storageContract, maintenanceId, hostUid, pvcUid, phase, startedAt, updatedAt]
                      properties:
                        storageContract: {type: string, enum: [legacy-floor, canonical]}
                        maintenanceId:
                          type: string
                          minLength: 1
                        hostUid:
                          type: string
