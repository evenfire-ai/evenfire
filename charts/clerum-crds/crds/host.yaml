apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hosts.clerum.io
  labels:
    app.kubernetes.io/name: host
    app.kubernetes.io/part-of: clerum
spec:
  group: clerum.io
  names:
    kind: Host
    listKind: HostList
    plural: hosts
    singular: host
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Host is the central entity that uses a context and connects to channels and MPC servers.
          properties:
            spec:
              type: object
              required:
                - host
                - contextRef
                - secretRef
              properties:
                host:
                  type: string
                  description: Host identifier (e.g. chatLLM).
                contextRef:
                  type: string
                  description: Reference to the context (e.g. context1) used for MPC servers and secrets.
                secretRef:
                  type: string
                  description: Name of the Kubernetes Secret containing API keys (openai-api-key, claude-api-key, zai-api-key).
                channels:
                  type: array
                  description: List of CommunicationChannel names this host interacts with.
                  items:
                    type: string
                model:
                  type: object
                  description: LLM model configuration.
                  properties:
                    provider:
                      type: string
                      enum:
                        - openai
                        - claude
                        - zai
                        - bailian
                        - vertex
                        - bedrock
                        - openrouter
                        - gemini
                        - deepseek
                        - groq
                        - together
                        - fireworks
                        - mistral
                        - xai
                        - cerebras
                        - deepinfra
                        - perplexity
                        - moonshot
                        - nebius
                        - novita
                        - azure
                      description: LLM provider to use.
                    name:
                      type: string
                      description: Model name (e.g. gpt-5.4-mini, claude-opus-4-7, glm-5.1).
                allowedModels:
                  # Per-host model allowlist subset (spec v2 Topic 3a). OPTIONAL,
                  # ADDITIVE: when absent or empty, the host offers the FULL global
                  # operator allowlist for its provider(s) — existing hosts are
                  # unaffected (back-compat). When set, it is the subset of the
                  # global allowlist this host offers: the per-session model
                  # selector (desktop-app, GET /v1/runtime/model[s]) and the
                  # write-time validation both restrict to this subset ∩ the live
                  # global allowlist. control-api validates every entry against the
                  # global allowlist on write — each (provider, model) pair must
                  # exist there. `provider` is a plain string (not enum'd here) so
                  # the global allowlist stays the single source of truth for valid
                  # pairs and adding a provider needn't touch a third enum.
                  type: array
                  items:
                    type: object
                    required:
                      - provider
                      - model
                    properties:
                      provider:
                        type: string
                        description: >-
                          LLM provider id; validated against the global allowlist
                          by control-api.
                      model:
                        type: string
                        description: >-
                          Model name; must exist in the global allowlist under
                          `provider`.
                llmPolicy:
                  # Provider fallback (spec v2 R5). ADDITIVE, OPT-IN: a Host with
                  # no llmPolicy behaves exactly as before (zero failover). When
                  # the primary model fails with an eligible error, mcp-host
                  # switches to the first available entry in `fallbacks`.
                  #
                  # ROLLOUT ORDER — CRD FIRST. apiextensions/v1 silently PRUNES
                  # unknown fields: if the runtime writes a Host with `llmPolicy`
                  # while the OLD CRD (without this schema) is still applied, the
                  # apiserver drops `llmPolicy` on admission with no error. Always
                  # apply this CRD before rolling out any component that reads or
                  # writes `spec.llmPolicy` (mcp-host, control-api).
                  type: object
                  description: >-
                    LLM provider fallback policy (opt-in). When the primary model
                    (spec.model) fails with an eligible error, mcp-host switches to
                    the first available entry in `fallbacks`, applies a cooldown to
                    the primary, and lazily retries it once the cooldown expires.
                    Every fallback model must be enabled in the operator allowlist
                    (validated on write by control-api).
                  required:
                    - fallbacks
                  properties:
                    cooldownSeconds:
                      type: integer
                      minimum: 0
                      default: 300
                      description: >-
                        Seconds the primary stays in cooldown after an eligible
                        failure before mcp-host lazily retries it. Default 300.
                    triggerOn:
                      type: array
                      description: >-
                        Error classes that trigger a fallback. Omit for the default
                        (all four classes). Restrict this list to avoid failing over
                        on unrecognized/transport errors (folded into
                        provider_unavailable).
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        enum:
                          - insufficient_quota
                          - auth
                          - provider_unavailable
                          - rate_limited
                    fallbacks:
                      type: array
                      minItems: 1
                      description: >-
                        Ordered fallback list, tried in order. The engine advances
                        to the next entry when the current one also fails.
                      items:
                        type: object
                        required:
                          - provider
                          - model
                        properties:
                          provider:
                            type: string
                            enum:
                              - openai
                              - claude
                              - zai
                              - bailian
                              - vertex
                              - bedrock
                              - openrouter
                              - gemini
                              - deepseek
                              - groq
                              - together
                              - fireworks
                              - mistral
                              - xai
                              - cerebras
                              - deepinfra
                              - perplexity
                              - moonshot
                              - nebius
                              - novita
                              - azure
                            description: >-
                              Fallback LLM provider. Same enum as spec.model.provider.
                          model:
                            type: string
                            description: >-
                              Fallback model name. Must be enabled in the operator
                              allowlist under `provider` (enforced on write).
                          credentialSlot:
                            type: string
                            # Defense-in-depth: mirror control-api's write-side
                            # format gate onto the CRD so a direct cluster apply
                            # (bypassing control-api) still gets a valid K8s Secret
                            # data key. Same pattern/length as SECRET_KEY_RE.
                            maxLength: 253
                            pattern: '^[-._a-zA-Z0-9]+$'
                            description: >-
                              Optional key of the Host's OWN `spec.secretRef` Secret
                              that feeds this fallback's credential (e.g. claude-api-key-fb1
                              for a same-provider-other-key fallback). mcp-host resolves
                              fallback slots from the Host secret. Absent = the provider's
                              normal slots. Existence of the key in the Secret is resolved
                              by mcp-host at runtime; control-api validates only its format
                              on write.
                approval:
                  type: object
                  description: Tool approval configuration. Controls who can approve tool executions.
                  properties:
                    defaultPolicy:
                      type: string
                      enum:
                        - cli_only
                        - channel_users
                        - designated_approvers
                      description: >-
                        Who can approve tool calls.
                        cli_only: Only HTTP /approve /deny endpoints.
                        channel_users: Any authorized channel user.
                        designated_approvers: Only users in approvers list.
                    channels:
                      type: object
                      description: Per-channel-type approval settings.
                      properties:
                        telegram:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether Telegram users can approve.
                            approvers:
                              type: array
                              description: List of Telegram user IDs allowed to approve.
                              items:
                                type: string
                        email:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether email users can approve.
                            approvers:
                              type: array
                              description: List of email addresses allowed to approve.
                              items:
                                type: string
                        slack:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether Slack users can approve.
                            approvers:
                              type: array
                              description: List of Slack user IDs allowed to approve.
                              items:
                                type: string
                    tools:
                      type: object
                      description: >-
                        Per-tool approval overrides for native mcp-host tools.
                        Map of native tool name (e.g. http_request, shell_exec)
                        to boolean: true forces approval, false skips approval.
                        Absent entries fall through to each tool's built-in default.
                        Out of scope: MCP tools (gated separately).
                      additionalProperties:
                        type: boolean
                desktop:
                  type: object
                  description: Desktop environment configuration. Enables a Linux desktop (XFCE + KasmVNC) with agent-accessible X11 and browser tools.
                  properties:
                    browser:
                      type: boolean
                      description: Enable Playwright browser tools (browser_open, browser_screenshot, etc.).
                    x11:
                      type: boolean
                      description: Enable X11 desktop tools (desktop_screenshot, desktop_click, desktop_type, etc.).
                lifecycle:
                  type: object
                  description: >-
                    Runtime lifecycle configuration. Cross-field constraints
                    (no CommunicationChannels, no desktop, satisfiable
                    SharedFileSystem co-location) are enforced at reconcile
                    time via the StatelessEnableRejected status condition, not
                    by this schema.
                  properties:
                    stateless:
                      type: boolean
                      default: false
                      description: >-
                        Enable the stateless agent lifecycle. mcp-host
                        persists session state to SQLite on the workspace PVC
                        and the operator may scale the Deployment to 0 while
                        status.lifecycle.state is suspended.
                workflowControl:
                  type: object
                  description: >-
                    Workflow broker scopes this first-party Host is allowed to
                    request in its mcp-host-control JWT. control-api remains the
                    authority for every workflow request; these scopes only
                    bound the broker tool surface available to the Host runtime.
                  properties:
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - workflow:list
                          - workflow:read
                          - workflow:trigger
                          - workflow:approval:resolve
                          - workflow:approval:decide
                      description: >-
                        Allowed workflow tool scopes. workflow_status and
                        workflow_health are covered by workflow:read; there is
                        no separate workflow_read native tool.
                personalization:
                  type: object
                  description: Identity files (admin-managed, read-only to the agent).
                  properties:
                    enabled:
                      type: boolean
                      description: Whether mcp-host should reconcile identity files from this block.
                    identity:
                      type: string
                      description: Content of IDENTITY.md (system-prompt section "## Identity").
                    soul:
                      type: string
                      description: Content of SOUL.md (system-prompt section "## Core Values").
                    agents:
                      type: string
                      description: Content of AGENTS.md (system-prompt section "## Agent Instructions").
                    user:
                      type: string
                      description: Content of USER.md (system-prompt section "## User Context").
            status:
              type: object
              properties:
                lifecycle:
                  type: object
                  description: >-
                    Durable stateless-lifecycle state. host-context-controller
                    derives Deployment replicas from state on every reconcile,
                    so a suspended Host survives controller restarts and
                    periodic resyncs.
                  required:
                    - state
                    - wakeHandledGeneration
                  properties:
                    state:
                      type: string
                      enum:
                        - active
                        - draining
                        - suspended
                    wakeHandledGeneration:
                      type: integer
                      description: Highest observed Host generation whose wake trigger has been handled.
                    reason:
                      type: string
                      description: Human-readable explanation when the stateless request was rejected.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - 'Unknown'
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
      additionalPrinterColumns:
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: Context
          type: string
          jsonPath: .spec.contextRef
        - name: Secret
          type: string
          jsonPath: .spec.secretRef
        - name: Provider
          type: string
          jsonPath: .spec.model.provider
      subresources:
        status: {}
