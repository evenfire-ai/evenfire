          jsonPath: .spec.transport.type
        - name: URL
          type: string
          jsonPath: .spec.transport.url
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Managed
          type: boolean
          jsonPath: .spec.managed
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
