---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wrc-trigger-sa
  namespace: control-plane
  labels:
    clerum.io/managed-by: clerum-wrc
    clerum.io/component: scheduling-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wrc-trigger-role
  labels:
    clerum.io/managed-by: clerum-wrc
rules:
  # Allow CronJob trigger container to POST to WRC service
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["create"]
  # Allow token introspection for authentication
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wrc-trigger-binding
  labels:
    clerum.io/managed-by: clerum-wrc
subjects:
  - kind: ServiceAccount
    name: wrc-trigger-sa
    namespace: control-plane
roleRef:
  kind: ClusterRole
  name: wrc-trigger-role
  apiGroup: rbac.authorization.k8s.io
