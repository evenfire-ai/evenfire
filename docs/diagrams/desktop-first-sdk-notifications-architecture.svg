<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111827; }
      .title { font-size: 17px; font-weight: 600; }
      .label { font-size: 12px; font-weight: 600; }
      .sub { font-size: 10px; fill: #6b7280; }
      .jwt { font-size: 10px; fill: #1d4ed8; font-weight: 600; }
      .jwt-muted { font-size: 10px; fill: #9ca3af; }
      .layer { fill: #fafafa; stroke: #e5e7eb; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .node { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .accent { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
      .green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; }
      .purple { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.2; }
      .orange { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; }
      .callout { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .callout-blue { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/></marker>
  </defs>

  <rect width="1200" height="868" fill="#ffffff"/>

  <!-- Header card -->
  <rect x="24" y="16" width="1152" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="36" class="title">Desktop-first SDK clientNotifications</text>
  <text x="40" y="52" class="sub">PR #518 · sandbox-recipes → control-api outbox → Desktop SSE/ACK → channel fallback</text>

  <!-- L1 -->
  <rect x="24" y="68" width="1152" height="208" rx="8" class="layer"/>
  <rect x="36" y="74" width="148" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="87" class="label">① sandbox-recipes</text>

  <rect x="40" y="100" width="132" height="58" rx="6" class="accent"/>
  <text x="52" y="118" class="label">WorkflowRecipe</text>
  <text x="52" y="132" class="sub">pluginWorkloadSdk</text>
  <text x="52" y="146" class="sub">allowedCallers</text>

  <rect x="188" y="100" width="152" height="58" rx="6" class="node"/>
  <text x="200" y="118" class="label">WRC reconciler</text>
  <text x="200" y="132" class="sub">Secrets + NP</text>
  <text x="200" y="146" class="sub">deploying until /configure</text>

  <rect x="356" y="100" width="136" height="66" rx="6" class="green"/>
  <text x="368" y="118" class="label">Plugin workload</text>
  <text x="368" y="132" class="sub">sdk-caller pod</text>
  <text x="368" y="146" class="sub">Bearer caller secret</text>
  <text x="368" y="158" class="jwt">HTTP + caller secret →</text>

  <rect x="508" y="100" width="168" height="58" rx="6" class="purple"/>
  <text x="516" y="118" class="label">Recipe mcp-host</text>
  <text x="516" y="132" class="sub">SDK server :8099</text>
  <text x="516" y="146" class="sub">client-notifications · prompt-bridge</text>

  <rect x="688" y="100" width="468" height="58" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="700" y="118" class="label">SDK gate (fail-closed)</text>
  <text x="700" y="132" class="sub">PLUGIN_WORKLOAD_SDK_ENABLED · recipeNamespace=sandbox-recipes</text>
  <text x="700" y="146" class="sub">caller Secret registry · separate from Host JWT</text>

  <!-- Trust-hop callouts aligned under WRC and recipe mcp-host -->
  <rect x="154" y="172" width="220" height="76" rx="6" class="callout"/>
  <text x="166" y="190" class="label">Provisioning WRC</text>
  <text x="166" y="206" class="jwt">InternalControl JWT</text>
  <text x="166" y="220" class="sub">POST /auth/mcp-host/…/tokens</text>
  <text x="166" y="234" class="sub">Host JWT Secret → mcp-host pod</text>

  <rect x="482" y="172" width="220" height="76" rx="6" class="callout-blue"/>
  <text x="490" y="190" class="label">Runtime SDK</text>
  <text x="490" y="206" class="jwt">Host JWT runtime token</text>
  <text x="490" y="220" class="sub">POST /mcp-host/plugin-workload-sdk/*</text>
  <text x="490" y="234" class="sub">:8099 → nginx → authorizer → outbox</text>

  <path d="M 172 129 L 188 129" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 340 129 L 356 129" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- L2 -->
  <rect x="24" y="296" width="1152" height="128" rx="8" class="layer"/>
  <rect x="36" y="302" width="132" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="315" class="label">② control-plane</text>

  <rect x="40" y="328" width="148" height="76" rx="6" class="node"/>
  <text x="52" y="348" class="label">nginx /mcp-host</text>
  <text x="52" y="362" class="jwt">Host JWT AuthN/Z</text>
  <text x="52" y="376" class="sub">plugin-workload-sdk</text>
  <text x="52" y="390" class="sub">routes</text>

  <rect x="204" y="328" width="168" height="76" rx="6" class="accent"/>
  <text x="216" y="348" class="label">control-api</text>
  <text x="216" y="362" class="sub">authorizer · grants</text>
  <text x="216" y="376" class="sub">quota · audit</text>
  <text x="216" y="390" class="jwt">/auth/mcp-host issuance</text>

  <rect x="388" y="328" width="168" height="76" rx="6" class="green"/>
  <text x="400" y="348" class="label">notification_deliveries</text>
  <text x="400" y="362" class="sub">plugin_workload_sdk</text>
  <text x="400" y="376" class="sub">.notification event</text>
  <text x="400" y="390" class="sub">grace on next_attempt_at</text>

  <path d="M 188 366 L 204 366" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 372 366 L 388 366" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="308" y="352" width="52" height="18" rx="3" class="callout"/>
  <text x="316" y="364" class="sub">enqueue</text>

  <!-- L3 -->
  <rect x="24" y="438" width="1152" height="128" rx="8" class="layer"/>
  <rect x="36" y="444" width="168" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="457" class="label">③ Desktop-first delivery</text>

  <rect x="40" y="472" width="152" height="76" rx="6" class="accent"/>
  <text x="52" y="492" class="label">Desktop App</text>
  <text x="52" y="506" class="sub">SSE sdk.notification</text>
  <text x="52" y="520" class="sub">POST …/ack</text>
  <text x="52" y="534" class="jwt">Session JWT</text>

  <rect x="208" y="472" width="152" height="76" rx="6" class="green"/>
  <text x="220" y="492" class="label">external-rest-api</text>
  <text x="220" y="506" class="sub">stream proxy + ACK</text>
  <text x="220" y="520" class="sub">notification prefs</text>
  <text x="220" y="534" class="jwt">Session JWT</text>

  <rect x="376" y="472" width="152" height="76" rx="6" class="purple"/>
  <text x="388" y="492" class="label">ACK service</text>
  <text x="388" y="506" class="sub">status=sent</text>
  <text x="388" y="520" class="sub">delivered_medium</text>
  <text x="388" y="534" class="sub">=desktop</text>

  <rect x="544" y="472" width="152" height="76" rx="6" class="orange"/>
  <text x="556" y="492" class="label">Settings UI</text>
  <text x="556" y="506" class="sub">strict PUT prefs</text>
  <text x="556" y="520" class="sub">preferredMedium</text>
  <text x="556" y="534" class="sub">channelFallback</text>

  <path d="M 192 510 L 208 510" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 360 510 L 376 510" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- L4 -->
  <rect x="24" y="580" width="1152" height="88" rx="8" class="layer"/>
  <rect x="36" y="586" width="348" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="599" class="label">④ Channel fallback (no desktop ACK before grace)</text>

  <rect x="388" y="612" width="168" height="44" rx="6" class="green"/>
  <text x="400" y="630" class="label">notification_deliveries</text>
  <text x="400" y="644" class="sub">queued · claimable</text>

  <rect x="572" y="612" width="168" height="44" rx="6" class="orange"/>
  <text x="584" y="630" class="label">channel-reader</text>
  <text x="584" y="644" class="sub">GET …/deliveries</text>

  <rect x="756" y="612" width="148" height="44" rx="6" class="green"/>
  <text x="768" y="630" class="label">Telegram / Slack</text>
  <text x="768" y="644" class="sub">verified medium</text>

  <path d="M 556 634 L 572 634" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 740 634 L 756 634" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Cross-layer connectors (drawn last so layer fills do not clip paths) -->
  <g id="connectors" fill="none">
    <!-- Plugin workload → recipe mcp-host (opaque caller secret over HTTP) -->
    <path d="M 492 133 L 508 129" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

    <!-- WRC / mcp-host → trust-hop callouts -->
    <path d="M 264 158 L 264 172" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
    <path d="M 592 158 L 592 172" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

    <!-- trust-hop callouts → control-plane (bus y=290 in gap between layers) -->
    <path d="M 264 248 L 264 290 L 288 290 L 288 328" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
    <path d="M 592 248 L 592 290 L 114 290 L 114 328" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

    <!-- outbox → external-rest-api SSE -->
    <path d="M 472 404 L 472 420 L 284 420 L 284 472" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <rect x="320" y="426" width="108" height="18" rx="3" class="callout"/>
    <text x="328" y="438" class="sub">SSE stream by userId</text>

    <!-- outbox → channel fallback queue -->
    <path d="M 472 404 L 472 612" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
    <rect x="476" y="548" width="76" height="18" rx="3" class="callout"/>
    <text x="484" y="560" class="sub">after grace</text>
  </g>

  <!-- Legend card -->
  <rect x="24" y="684" width="1152" height="122" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="36" y="690" width="64" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="703" class="label">Legend</text>

  <rect x="40" y="714" width="1112" height="22" rx="4" fill="#ffffff" stroke="#eef2f7" stroke-width="1"/>
  <line x1="52" y1="725" x2="78" y2="725" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="84" y="729" class="sub">SDK / Session</text>
  <line x1="180" y1="725" x2="206" y2="725" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="212" y="729" class="sub">enqueue / SSE</text>
  <line x1="310" y1="725" x2="336" y2="725" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
  <text x="342" y="729" class="sub">fallback after grace</text>
  <line x1="490" y1="725" x2="516" y2="725" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="522" y="729" class="sub">Host JWT provisioning</text>

  <rect x="40" y="742" width="1112" height="36" rx="4" fill="#ffffff" stroke="#eef2f7" stroke-width="1"/>
  <text x="52" y="756" class="sub">JWT planes — Admin /admin · Session /external · Host /mcp-host</text>
  <text x="52" y="770" class="sub">InternalControl /auth/mcp-host (WRC provisioning only)</text>

  <rect x="40" y="784" width="1112" height="22" rx="4" fill="#ffffff" stroke="#eef2f7" stroke-width="1"/>
  <text x="52" y="798" class="sub">Not used here — RPC JWT (/rpc) · workload uses opaque caller Secret only</text>

  <!-- E2E footnote card -->
  <rect x="24" y="818" width="1152" height="36" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="834" class="sub">E2E: workload → desktop ACK → delivered_medium=desktop</text>
  <text x="40" y="848" class="sub">else channel-reader after grace · strict PUT preferredMedium + channelFallbackEnabled</text>
</svg>
