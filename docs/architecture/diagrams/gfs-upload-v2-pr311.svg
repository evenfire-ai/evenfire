  <text x="64" y="66" class="title">GFS Upload v2 · resumable indexed flow</text>
  <text x="64" y="94" class="subtitle">PR #311 · product cap 200 MiB · every data request stays below the Cloudflare request ceiling</text>
  <rect x="1130" y="48" width="190" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="1225" y="70" text-anchor="middle" class="chip">ARCHITECTURE COMPLEMENT</text>
