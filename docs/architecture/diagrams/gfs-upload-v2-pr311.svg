<?xml version="1.0" encoding="UTF-8"?>
<!-- Generated with Fireworks Tech Graph, Style 1 (Flat Icon), refined for PR #311. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">GFS Upload v2 — PR #311 resumable indexed upload flow</title>
  <desc id="diagram-desc">Control UI and Desktop send bounded indexed parts through External REST and Control API to the GFSC writer, PostgreSQL, and GFS storage. Resume uses HEAD and status reconciliation without blind replay.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #123226; }
    .subtitle { font-size: 14px; fill: #3f6250; }
    .section { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #2d5d46; }
    .label { font-size: 16px; font-weight: 700; fill: #16251e; }
    .sub { font-size: 12px; fill: #557064; }
    .tiny { font-size: 11px; fill: #60766b; }
    .arrow-label { font-size: 11px; font-weight: 700; fill: #32483b; }
    .chip { font-size: 12px; font-weight: 700; fill: #24533a; }
    .legend { font-size: 11px; fill: #50665a; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effbf3"/>
      <stop offset="1" stop-color="#d7f1e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#347257" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowControl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowStore" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowRecovery" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrowReject" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
