  <text x="72" y="683" class="section" fill="#6b46a1">RECOVERY CONTRACT</text>
  <text x="72" y="703" class="tiny">Durable status is authoritative after timeout, disconnect, or process restart.</text>
  <rect x="420" y="724" width="430" height="88" rx="12" fill="#ffffff" stroke="#bda7ef" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="635" y="756" text-anchor="middle" class="label">HEAD + status reconciliation</text>
  <text x="635" y="778" text-anchor="middle" class="sub">adopt committed parts · retry absent parts only</text>
  <text x="635" y="798" text-anchor="middle" class="tiny">outcome_unknown never becomes blind replay</text>
